<title>Italia Trip OS 3.0 · Roma · Nápoles · Pompeia — 09 a 15 ago 2026</title>
<style>
/* ============================================================
   PALETA — fresco pompeiano: vermelho de Pompeia, amarelo de
   Nápoles, basalto vulcânico, travertino, bronze oxidado.
   ============================================================ */
:root{
  --basalt:#14120F;
  --slate:#1F1C18;
  --slate-2:#2A2621;
  --line:#39332B;
  --travertine:#EFE8DA;
  --muted:#A79C8B;
  --pompeii:#A32E22;
  --pompeii-lo:#7B221A;
  --naples:#E3B23C;
  --verdigris:#5C8A7B;

  --bg:var(--basalt);
  --surface:var(--slate);
  --surface-2:var(--slate-2);
  --ink:var(--travertine);
  --ink-dim:var(--muted);
  --rule:var(--line);

  --display:Georgia,"Iowan Old Style","Times New Roman",serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --data:ui-monospace,"SF Mono",Menlo,Consolas,monospace;

  --nav-h:64px;
}
html[data-theme="light"]{
  --bg:#F2EDE3;
  --surface:#FFFDF8;
  --surface-2:#EAE3D5;
  --ink:#221E19;
  --ink-dim:#6B6153;
  --rule:#D8CFBD;
  --pompeii:#96271C;
  --verdigris:#3F6B5C;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overscroll-behavior-y:contain}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--body);font-size:16px;line-height:1.5;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
  min-height:100dvh;
}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit}

/* ---------- CABEÇALHO ---------- */
.top{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,var(--bg) 72%,transparent);
  padding:14px 18px 10px;
  border-bottom:1px solid var(--rule);
}
.top-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-size:19px;line-height:1.15;letter-spacing:.02em}
.brand span{display:block;font-family:var(--data);font-size:10px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--ink-dim);margin-bottom:3px}
.icon-btn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  border:1px solid var(--rule);background:var(--surface);font-size:16px;flex:none}
.icon-btn:active{transform:scale(.94)}

/* Contagem regressiva */
.countdown{
  margin-top:10px;display:flex;align-items:center;gap:11px;
  background:var(--surface);border:1px solid var(--rule);
  border-left:3px solid var(--naples);
  border-radius:12px;padding:9px 13px;
}
.countdown .cd-time{font-family:var(--data);font-size:19px;font-weight:600;
  letter-spacing:.02em;color:var(--naples);font-variant-numeric:tabular-nums}
.countdown .cd-txt{font-size:12.5px;line-height:1.3;color:var(--ink-dim);min-width:0}
.countdown .cd-txt b{display:block;color:var(--ink);font-weight:600;font-size:13.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.countdown.is-late{border-left-color:var(--pompeii)}
.countdown.is-late .cd-time{color:var(--pompeii)}

/* ---------- ABAS ---------- */
.view{display:none;padding:18px 18px 30px;animation:in .22s ease}
.view.active{display:block}
@keyframes in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

/* ---------- SELETOR DE DIAS ---------- */
.daybar{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 14px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.daybar::-webkit-scrollbar{display:none}
.daychip{flex:none;border:1px solid var(--rule);background:var(--surface);
  border-radius:12px;padding:8px 12px;text-align:left;min-width:78px}
.daychip .dc-wd{font-family:var(--data);font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-dim)}
.daychip .dc-d{font-family:var(--display);font-size:17px;line-height:1.1;margin-top:2px}
.daychip .dc-city{font-size:11px;color:var(--ink-dim);margin-top:1px}
.daychip[aria-selected="true"]{background:var(--pompeii);border-color:var(--pompeii);color:#FFF6EC}
.daychip[aria-selected="true"] .dc-wd,.daychip[aria-selected="true"] .dc-city{color:#F3D7CB}
.daychip.is-today::after{content:"";display:block;width:5px;height:5px;border-radius:50%;
  background:var(--naples);margin-top:5px}

/* ---------- CABEÇALHO DO DIA ---------- */
.dayhead{margin-bottom:16px}
.dayhead h2{font-family:var(--display);font-size:25px;margin:0;line-height:1.15;letter-spacing:.01em}
.dayhead .dh-meta{font-family:var(--data);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-dim);margin-bottom:5px}
.progress{margin-top:12px}
.progress .bar{height:5px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--verdigris);
  border-radius:99px;transition:width .35s ease}
.progress .lbl{display:flex;justify-content:space-between;font-family:var(--data);
  font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim);margin-top:6px}

/* ---------- TRILHA / TIMELINE (elemento-assinatura) ---------- */
.rail{position:relative;padding-left:56px}
.rail::before{content:"";position:absolute;left:23px;top:8px;bottom:8px;width:1px;
  background:linear-gradient(180deg,transparent,var(--rule) 8%,var(--rule) 92%,transparent)}

.stop{position:relative;margin-bottom:14px}
.stop .marker{position:absolute;left:-56px;top:2px;width:47px;text-align:right}
.stop .mk-time{font-family:var(--data);font-size:13px;font-weight:600;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stop .mk-dur{font-family:var(--data);font-size:9.5px;color:var(--ink-dim);margin-top:1px}
.stop .dot{position:absolute;left:-38px;top:6px;width:11px;height:11px;border-radius:50%;
  background:var(--bg);border:2px solid var(--rule);z-index:2}

.card{background:var(--surface);border:1px solid var(--rule);border-radius:14px;
  padding:13px 14px;transition:opacity .25s,background .25s}
.card h3{margin:0;font-family:var(--display);font-size:17.5px;line-height:1.25;
  font-weight:600;letter-spacing:.005em}
.card .cat{font-family:var(--data);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-dim);display:flex;align-items:center;gap:6px;margin-bottom:4px}
.card .loc{font-size:13px;color:var(--ink-dim);margin-top:5px;line-height:1.4}
.card .note{font-size:13px;margin-top:8px;padding-left:10px;
  border-left:2px solid var(--rule);color:var(--ink-dim);line-height:1.45}
.card .note.tip{border-left-color:var(--naples);color:var(--ink)}
.card .actions{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}

.btn{border:1px solid var(--rule);background:var(--surface-2);border-radius:10px;
  padding:9px 13px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;
  gap:6px;min-height:40px;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn.maps{border-color:transparent;background:var(--pompeii);color:#FFF6EC}
.btn.done{flex:1;justify-content:center}
.btn.done[aria-pressed="true"]{background:var(--verdigris);border-color:transparent;color:#0E1614}
.btn.icon-only{padding:0;width:40px;min-width:40px;justify-content:center;flex:none;background:var(--surface-2)}

/* Estados temporais */
.stop[data-state="past"] .dot{background:var(--rule);border-color:var(--rule)}
.stop[data-state="past"] .mk-time{color:var(--ink-dim);font-weight:500}
.stop[data-state="now"] .dot{background:var(--naples);border-color:var(--naples);
  box-shadow:0 0 0 5px color-mix(in srgb,var(--naples) 22%,transparent)}
.stop[data-state="now"] .card{border-color:var(--naples)}
.stop[data-state="now"] .mk-time{color:var(--naples)}
.stop[data-state="next"] .dot{border-color:var(--naples)}
.stop[data-state="next"] .card{border-color:color-mix(in srgb,var(--naples) 45%,var(--rule))}
.stop[data-state="late"] .dot{background:var(--pompeii);border-color:var(--pompeii)}
.stop[data-state="late"] .card{border-color:var(--pompeii)}
.stop[data-state="late"] .mk-time{color:var(--pompeii)}

.badge{font-family:var(--data);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  padding:3px 7px;border-radius:99px;margin-left:auto;font-weight:600}
.badge.now{background:var(--naples);color:#1A1405}
.badge.next{background:transparent;border:1px solid var(--naples);color:var(--naples)}
.badge.late{background:var(--pompeii);color:#FFF0EA}

/* Concluído — ofuscado mas legível e clicável */
.stop.is-done .card{opacity:.42;background:var(--surface-2)}
.stop.is-done .card h3{text-decoration:line-through;text-decoration-thickness:1.5px}
.stop.is-done .dot{background:var(--verdigris);border-color:var(--verdigris);box-shadow:none}
.stop.is-done .badge{display:none}
.stop.is-done .card:focus-within,.stop.is-done .card:hover{opacity:.8}

/* Etiqueta de sugestão a confirmar */
.sugg{display:inline-block;font-family:var(--data);font-size:9px;letter-spacing:.13em;
  text-transform:uppercase;border:1px dashed var(--naples);color:var(--naples);
  border-radius:99px;padding:2px 7px;margin-left:7px;vertical-align:2px}

/* Bloco de deslocamento entre paradas */
.leg{font-family:var(--data);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-dim);margin:-6px 0 12px;padding-left:2px;display:flex;align-items:center;gap:7px}
.leg::before{content:"";width:14px;height:1px;background:var(--rule)}

/* ---------- ANOTAÇÕES ---------- */
.notes{margin-top:22px}
.notes label{font-family:var(--data);font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-dim);display:block;margin-bottom:7px}
textarea{width:100%;min-height:96px;background:var(--surface);border:1px solid var(--rule);
  border-radius:12px;padding:12px;resize:vertical;font-size:14.5px;line-height:1.5}
textarea:focus,input:focus{outline:2px solid var(--naples);outline-offset:1px}

/* ---------- ORÇAMENTO ---------- */
.total{background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--pompeii);
  border-radius:14px;padding:15px;margin-bottom:18px}
.total .t-lbl{font-family:var(--data);font-size:10px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink-dim)}
.total .t-grid{display:flex;gap:26px;margin-top:9px}
.total .t-val{font-family:var(--display);font-size:27px;line-height:1;font-variant-numeric:tabular-nums}
.total .t-val small{font-size:13px;color:var(--ink-dim);font-family:var(--data);
  display:block;letter-spacing:.12em;text-transform:uppercase;margin-top:5px}
.t-diff{font-family:var(--data);font-size:12px;margin-top:11px;padding-top:11px;
  border-top:1px solid var(--rule);color:var(--ink-dim)}

.bday{background:var(--surface);border:1px solid var(--rule);border-radius:14px;
  padding:13px 14px;margin-bottom:11px}
.bday h4{margin:0 0 10px;font-family:var(--display);font-size:16px;display:flex;
  justify-content:space-between;align-items:baseline;gap:10px}
.bday h4 em{font-family:var(--data);font-size:11px;font-style:normal;color:var(--ink-dim);
  letter-spacing:.1em}
.brow{display:grid;grid-template-columns:1fr 78px 78px;gap:8px;align-items:center;margin-bottom:7px}
.brow .bk{font-size:12.5px;color:var(--ink-dim)}
.brow input{width:100%;background:var(--surface-2);border:1px solid var(--rule);
  border-radius:9px;padding:8px 9px;font-family:var(--data);font-size:13px;
  text-align:right;font-variant-numeric:tabular-nums;min-height:38px}
.bhead{display:grid;grid-template-columns:1fr 78px 78px;gap:8px;font-family:var(--data);
  font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-dim);
  margin-bottom:7px;text-align:right}
.bhead span:first-child{text-align:left}

/* ---------- MAPA GERAL ---------- */
.mapgroup{margin-bottom:24px}
.mapgroup h4{font-family:var(--display);font-size:19px;margin:0 0 3px}
.mapgroup .mg-sub{font-family:var(--data);font-size:10px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--ink-dim);margin-bottom:11px}
.mlink{display:flex;align-items:center;gap:11px;padding:11px 13px;background:var(--surface);
  border:1px solid var(--rule);border-radius:11px;margin-bottom:7px;text-decoration:none;
  min-height:46px}
.mlink .ml-n{flex:1;font-size:14px;line-height:1.3;min-width:0}
.mlink .ml-n small{display:block;color:var(--ink-dim);font-size:11.5px;margin-top:1px}
.mlink .ml-go{font-family:var(--data);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--pompeii);font-weight:700;flex:none}
.mlink.is-done{opacity:.4}
.mlink.is-done .ml-n{text-decoration:line-through}

/* ---------- NAVEGAÇÃO INFERIOR ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;
  grid-template-columns:repeat(4,1fr);
  background:color-mix(in srgb,var(--bg) 94%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--rule);
  padding-bottom:env(safe-area-inset-bottom)}
nav button{height:var(--nav-h);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;color:var(--ink-dim);font-family:var(--data);
  font-size:9.5px;letter-spacing:.11em;text-transform:uppercase}
nav button i{font-style:normal;line-height:1;display:flex}
nav button i svg{width:20px;height:20px}
nav button[aria-selected="true"]{color:var(--pompeii)}
html[data-theme="dark"] nav button[aria-selected="true"]{color:var(--naples)}

/* ---------- RODAPÉ DE DADOS ---------- */
.datafoot{margin-top:26px;padding-top:16px;border-top:1px solid var(--rule);
  display:flex;gap:9px;flex-wrap:wrap}
.datafoot .btn{font-size:12px;padding:8px 12px;min-height:36px}
.datafoot .hint{font-size:11.5px;color:var(--ink-dim);width:100%;margin-top:6px;line-height:1.45}

/* ---------- ÍCONES DE CATEGORIA (SVG, linha, cor herdada) ---------- */
.cat svg{width:12.5px;height:12.5px;vertical-align:-2.5px;flex:none}
.icon-btn svg{width:18px;height:18px}
.btn svg{width:15px;height:15px;flex:none}
.mlink > span:first-child svg{width:15px;height:15px}

/* ---------- HERO DO DIA (elemento-assinatura) ---------- */
.dayhero{position:relative;margin:-18px -18px 18px;padding:24px 18px 18px;
  background:linear-gradient(150deg,var(--surface) 45%,var(--surface-2));
  border-bottom:1px solid var(--rule);overflow:hidden}
.dayhero .hero-art{position:absolute;right:-8px;top:-8px;width:128px;height:128px;
  color:var(--rule);opacity:.6;pointer-events:none}
html[data-theme="light"] .dayhero .hero-art{opacity:.4}
.dayhero .dh-inner{position:relative;z-index:1;max-width:78%}
.dayhero .dh-tag{font-size:13px;color:var(--ink-dim);margin-top:7px;line-height:1.4}

.day-actions{display:flex;gap:8px;margin:-4px 0 18px}
.day-actions .btn{font-size:12px;padding:8px 12px;min-height:36px;flex:1;justify-content:center}

/* ---------- TRILHA DA VIAGEM (visão geral tocável) ---------- */
.triptrack{display:flex;gap:6px;margin-bottom:18px}
.tp-item{flex:1;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center}
.tp-bar{width:100%;height:30px;border-radius:8px;background:var(--surface-2);
  border:1px solid var(--rule);position:relative;overflow:hidden}
.tp-bar i{position:absolute;left:0;right:0;bottom:0;background:var(--verdigris);
  transition:height .3s ease}
.tp-item.is-today .tp-bar{border-color:var(--naples)}
.tp-lbl{font-family:var(--data);font-size:9px;letter-spacing:.05em;color:var(--ink-dim);
  margin-top:5px}
.tp-item.is-today .tp-lbl{color:var(--naples)}

/* ---------- AVISO / TOAST ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);
  font-size:12.5px;font-weight:600;padding:10px 18px;border-radius:99px;opacity:0;
  pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:60;
  white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(min-width:720px){
  body{max-width:760px;margin:0 auto}
  nav{max-width:760px;margin:0 auto}
  .rail{padding-left:64px}
  .rail::before{left:27px}
  .stop .marker{left:-64px;width:53px}
  .stop .dot{left:-42px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ========================================================================== */
/* ITALIA TRIP OS 2.0 — CAMADA PROFISSIONAL                                  */
/* ========================================================================== */
/* Esta camada amplia o aplicativo original sem dependências externas.        */
/* Mobile first, acessível, responsiva, compatível com arquivo local.          */
/* ========================================================================== */

:root {
  --pro-radius-xs: 8px;
  --pro-radius-sm: 12px;
  --pro-radius-md: 16px;
  --pro-radius-lg: 22px;
  --pro-radius-xl: 30px;
  --pro-shadow-sm: 0 8px 22px rgba(0, 0, 0, .10);
  --pro-shadow-md: 0 18px 48px rgba(0, 0, 0, .16);
  --pro-shadow-lg: 0 28px 80px rgba(0, 0, 0, .24);
  --pro-glass: color-mix(in srgb, var(--surface) 86%, transparent);
  --pro-positive: #64A88F;
  --pro-warning: #D9A93D;
  --pro-danger: #C35447;
  --pro-info: #6E96C8;
  --pro-purple: #8B78B8;
  --pro-pink: #B96B82;
  --pro-max: 920px;
  --pro-content-pad: 18px;
  --pro-bottom-safe: calc(var(--nav-h) + env(safe-area-inset-bottom) + 22px);
}

html {
  scroll-behavior: smooth;
  text-rendering: optimizeLegibility;
}

body {
  overflow-x: hidden;
}

body.pro-modal-open {
  overflow: hidden;
}

[hidden] {
  display: none !important;
}

button,
a,
input,
textarea,
select {
  touch-action: manipulation;
}

button:focus-visible,
a:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible {
  outline: 2px solid var(--naples);
  outline-offset: 3px;
}

.pro-sr-only {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  margin: -1px !important;
  overflow: hidden !important;
  clip: rect(0, 0, 0, 0) !important;
  white-space: nowrap !important;
  border: 0 !important;
}

.pro-hidden {
  display: none !important;
}

.pro-no-scrollbar {
  scrollbar-width: none;
}

.pro-no-scrollbar::-webkit-scrollbar {
  display: none;
}

/* -------------------------------------------------------------------------- */
/* TOPO TURBINADO                                                              */
/* -------------------------------------------------------------------------- */

.top {
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.top-row {
  align-items: center;
}

.pro-top-actions {
  display: flex;
  align-items: center;
  gap: 7px;
}

.pro-status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--pro-positive);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--pro-positive) 18%, transparent);
}

.pro-status-dot.offline {
  background: var(--pro-warning);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--pro-warning) 18%, transparent);
}

.pro-mini-btn {
  min-width: 38px;
  height: 38px;
  border-radius: 11px;
  border: 1px solid var(--rule);
  background: var(--surface);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  color: var(--ink);
  padding: 0 10px;
  font-size: 12px;
  font-weight: 700;
}

.pro-mini-btn svg {
  width: 17px;
  height: 17px;
}

.pro-mini-btn.is-active {
  background: var(--naples);
  color: #17130A;
  border-color: var(--naples);
}

/* -------------------------------------------------------------------------- */
/* NAVEGAÇÃO PRINCIPAL COM 6 ÁREAS                                            */
/* -------------------------------------------------------------------------- */

nav {
  grid-template-columns: repeat(6, minmax(62px, 1fr));
  overflow-x: auto;
  overscroll-behavior-x: contain;
  scrollbar-width: none;
}

nav::-webkit-scrollbar {
  display: none;
}

nav button {
  min-width: 62px;
  padding: 0 4px;
}

nav button i {
  min-height: 21px;
}

nav button[aria-selected="true"] {
  font-weight: 700;
}

/* -------------------------------------------------------------------------- */
/* BASE DE SEÇÕES E CABEÇALHOS                                                */
/* -------------------------------------------------------------------------- */

.pro-page-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 17px;
}

.pro-page-head-copy {
  min-width: 0;
}

.pro-eyebrow {
  font-family: var(--data);
  font-size: 10px;
  letter-spacing: .17em;
  text-transform: uppercase;
  color: var(--ink-dim);
  margin-bottom: 5px;
}

.pro-page-title {
  margin: 0;
  font-family: var(--display);
  font-size: clamp(26px, 7vw, 36px);
  line-height: 1.05;
  letter-spacing: -.015em;
}

.pro-page-subtitle {
  margin: 7px 0 0;
  max-width: 620px;
  color: var(--ink-dim);
  font-size: 13.5px;
  line-height: 1.5;
}

.pro-section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin: 24px 0 10px;
}

.pro-section-title h3 {
  margin: 0;
  font-family: var(--display);
  font-size: 19px;
  line-height: 1.2;
}

.pro-section-title small {
  color: var(--ink-dim);
  font-family: var(--data);
  font-size: 10px;
  letter-spacing: .08em;
  text-transform: uppercase;
}

.pro-divider {
  height: 1px;
  background: var(--rule);
  margin: 22px 0;
}

/* -------------------------------------------------------------------------- */
/* CARDS DE KPI / DASHBOARD                                                   */
/* -------------------------------------------------------------------------- */

.pro-kpi-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 14px;
}

.pro-kpi {
  position: relative;
  min-height: 112px;
  padding: 14px;
  background: linear-gradient(145deg, var(--surface), var(--surface-2));
  border: 1px solid var(--rule);
  border-radius: var(--pro-radius-md);
  overflow: hidden;
}

.pro-kpi::after {
  content: "";
  position: absolute;
  right: -26px;
  bottom: -34px;
  width: 84px;
  height: 84px;
  border-radius: 50%;
  background: color-mix(in srgb, var(--naples) 10%, transparent);
}

.pro-kpi-label {
  position: relative;
  z-index: 1;
  color: var(--ink-dim);
  font-family: var(--data);
  font-size: 9.5px;
  letter-spacing: .13em;
  text-transform: uppercase;
}

.pro-kpi-value {
  position: relative;
  z-index: 1;
  margin-top: 7px;
  font-family: var(--display);
  font-size: 27px;
  line-height: 1;
}

.pro-kpi-value.pro-small {
  font-size: 20px;
}

.pro-kpi-foot {
  position: relative;
  z-index: 1;
  margin-top: 8px;
  color: var(--ink-dim);
  font-size: 11px;
}

.pro-kpi.accent {
  border-color: color-mix(in srgb, var(--naples) 55%, var(--rule));
}

.pro-kpi.danger {
  border-color: color-mix(in srgb, var(--pompeii) 60%, var(--rule));
}

.pro-kpi.positive {
  border-color: color-mix(in srgb, var(--pro-positive) 60%, var(--rule));
}

/* -------------------------------------------------------------------------- */
/* HERO DE STATUS / PRÓXIMA PARADA                                            */
/* -------------------------------------------------------------------------- */

.pro-now-card {
  position: relative;
  overflow: hidden;
  border-radius: var(--pro-radius-lg);
  border: 1px solid var(--rule);
  background:
    radial-gradient(circle at 88% 8%, color-mix(in srgb, var(--naples) 18%, transparent), transparent 34%),
    linear-gradient(145deg, var(--surface), var(--surface-2));
  padding: 18px;
  box-shadow: var(--pro-shadow-sm);
}

.pro-now-card.pro-alert {
  background:
    radial-gradient(circle at 88% 8%, color-mix(in srgb, var(--pompeii) 20%, transparent), transparent 34%),
    linear-gradient(145deg, var(--surface), var(--surface-2));
}

.pro-now-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.pro-now-label {
  font-family: var(--data);
  font-size: 10px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--naples);
}

.pro-now-time {
  font-family: var(--data);
  font-size: 12px;
  color: var(--ink-dim);
}

.pro-now-title {
  margin: 10px 0 0;
  max-width: 86%;
  font-family: var(--display);
  font-size: 24px;
  line-height: 1.12;
}

.pro-now-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 11px;
}

.pro-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 28px;
  padding: 5px 9px;
  border-radius: 999px;
  border: 1px solid var(--rule);
  background: color-mix(in srgb, var(--surface-2) 86%, transparent);
  font-size: 11px;
  color: var(--ink-dim);
}

.pro-pill strong {
  color: var(--ink);
  font-weight: 700;
}

.pro-now-actions {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin-top: 16px;
}

.pro-action {
  min-height: 44px;
  border-radius: 12px;
  border: 1px solid var(--rule);
  background: var(--surface-2);
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 7px;
  padding: 9px 12px;
  text-decoration: none;
  font-size: 12.5px;
  font-weight: 700;
}

.pro-action.primary {
  background: var(--pompeii);
  border-color: var(--pompeii);
  color: #FFF5EF;
}

.pro-action.gold {
  background: var(--naples);
  border-color: var(--naples);
  color: #1C160A;
}

.pro-action.ghost {
  background: transparent;
}

.pro-action.danger {
  border-color: color-mix(in srgb, var(--pro-danger) 60%, var(--rule));
  color: var(--pro-danger);
}

/* -------------------------------------------------------------------------- */
/* AÇÕES RÁPIDAS                                                               */
/* -------------------------------------------------------------------------- */

.pro-quick-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}

.pro-quick {
  min-width: 0;
  border: 1px solid var(--rule);
  border-radius: 14px;
  background: var(--surface);
  padding: 10px 7px;
  min-height: 78px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 7px;
  text-align: center;
  color: var(--ink);
}

.pro-quick-icon {
  width: 31px;
  height: 31px;
  display: grid;
  place-items: center;
  border-radius: 10px;
  background: var(--surface-2);
  font-size: 15px;
}

.pro-quick-label {
  width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 10.5px;
  color: var(--ink-dim);
}

/* -------------------------------------------------------------------------- */
/* BARRA DE PESQUISA E FILTROS                                                 */
/* -------------------------------------------------------------------------- */

.pro-toolbar {
  position: sticky;
  top: 72px;
  z-index: 22;
  margin: -2px -18px 14px;
  padding: 9px 18px 10px;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid color-mix(in srgb, var(--rule) 65%, transparent);
}

.pro-search-wrap {
  position: relative;
}

.pro-search {
  width: 100%;
  min-height: 44px;
  padding: 10px 42px 10px 40px;
  border-radius: 13px;
  border: 1px solid var(--rule);
  background: var(--surface);
  color: var(--ink);
  font-size: 13.5px;
}

.pro-search-icon {
  position: absolute;
  left: 13px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--ink-dim);
  pointer-events: none;
}

.pro-search-clear {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 9px;
  color: var(--ink-dim);
}

.pro-filter-row {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  margin-top: 8px;
  padding-bottom: 1px;
  scrollbar-width: none;
}

.pro-filter-row::-webkit-scrollbar {
  display: none;
}

.pro-filter {
  flex: none;
  min-height: 34px;
  padding: 7px 11px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink-dim);
  font-size: 11px;
  font-weight: 700;
}

.pro-filter.is-active {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
}

/* -------------------------------------------------------------------------- */
/* MELHORIAS NA TIMELINE ORIGINAL                                             */
/* -------------------------------------------------------------------------- */

.stop {
  scroll-margin-top: 150px;
}

.stop .card {
  box-shadow: 0 6px 22px rgba(0, 0, 0, .035);
}

.card .pro-stop-tools {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 6px;
  margin-top: 9px;
  padding-top: 9px;
  border-top: 1px dashed var(--rule);
}

.pro-icon-tool {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  border: 1px solid var(--rule);
  background: transparent;
  display: grid;
  place-items: center;
  color: var(--ink-dim);
  font-size: 14px;
}

.pro-icon-tool.is-favorite {
  color: var(--naples);
  border-color: color-mix(in srgb, var(--naples) 65%, var(--rule));
  background: color-mix(in srgb, var(--naples) 9%, transparent);
}

.pro-icon-tool.is-skipped {
  color: var(--pro-warning);
}

.pro-delay-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 0 0 13px;
  padding: 10px 11px;
  border: 1px solid var(--rule);
  border-radius: 12px;
  background: var(--surface);
}

.pro-delay-copy {
  min-width: 0;
}

.pro-delay-copy b {
  display: block;
  font-size: 12.5px;
}

.pro-delay-copy small {
  display: block;
  margin-top: 2px;
  color: var(--ink-dim);
  font-size: 10.5px;
}

.pro-delay-controls {
  flex: none;
  display: flex;
  align-items: center;
  gap: 5px;
}

.pro-delay-btn {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border: 1px solid var(--rule);
  border-radius: 10px;
  background: var(--surface-2);
  font-weight: 800;
}

.pro-delay-value {
  min-width: 56px;
  text-align: center;
  font-family: var(--data);
  font-size: 11px;
  color: var(--naples);
}

/* -------------------------------------------------------------------------- */
/* CARTEIRA DE RESERVAS                                                        */
/* -------------------------------------------------------------------------- */

.pro-wallet-summary {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin-bottom: 16px;
}

.pro-wallet-stat {
  padding: 11px 9px;
  border-radius: 13px;
  background: var(--surface);
  border: 1px solid var(--rule);
  text-align: center;
}

.pro-wallet-stat strong {
  display: block;
  font-family: var(--display);
  font-size: 21px;
  line-height: 1;
}

.pro-wallet-stat span {
  display: block;
  margin-top: 5px;
  color: var(--ink-dim);
  font-family: var(--data);
  font-size: 8.5px;
  letter-spacing: .10em;
  text-transform: uppercase;
}

.pro-wallet-list {
  display: grid;
  gap: 10px;
}

.pro-ticket {
  position: relative;
  overflow: hidden;
  border: 1px solid var(--rule);
  background: var(--surface);
  border-radius: var(--pro-radius-md);
  padding: 14px;
}

.pro-ticket::before,
.pro-ticket::after {
  content: "";
  position: absolute;
  top: 56px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--bg);
  border: 1px solid var(--rule);
}

.pro-ticket::before {
  left: -10px;
}

.pro-ticket::after {
  right: -10px;
}

.pro-ticket-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  padding-bottom: 12px;
  margin-bottom: 12px;
  border-bottom: 1px dashed var(--rule);
}

.pro-ticket-kicker {
  font-family: var(--data);
  color: var(--ink-dim);
  font-size: 9px;
  letter-spacing: .14em;
  text-transform: uppercase;
}

.pro-ticket-title {
  margin: 4px 0 0;
  font-family: var(--display);
  font-size: 18px;
  line-height: 1.2;
}

.pro-ticket-status {
  flex: none;
  border-radius: 999px;
  padding: 5px 8px;
  font-family: var(--data);
  font-size: 8.5px;
  letter-spacing: .09em;
  text-transform: uppercase;
  font-weight: 800;
}

.pro-ticket-status.confirmed {
  color: var(--pro-positive);
  border: 1px solid color-mix(in srgb, var(--pro-positive) 50%, transparent);
  background: color-mix(in srgb, var(--pro-positive) 10%, transparent);
}

.pro-ticket-status.pending {
  color: var(--pro-warning);
  border: 1px solid color-mix(in srgb, var(--pro-warning) 50%, transparent);
  background: color-mix(in srgb, var(--pro-warning) 10%, transparent);
}

.pro-ticket-status.urgent {
  color: var(--pro-danger);
  border: 1px solid color-mix(in srgb, var(--pro-danger) 50%, transparent);
  background: color-mix(in srgb, var(--pro-danger) 10%, transparent);
}

.pro-ticket-status.planned {
  color: var(--pro-info);
  border: 1px solid color-mix(in srgb, var(--pro-info) 50%, transparent);
  background: color-mix(in srgb, var(--pro-info) 10%, transparent);
}

.pro-ticket-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
}

.pro-ticket-field {
  min-width: 0;
}

.pro-ticket-field span {
  display: block;
  color: var(--ink-dim);
  font-family: var(--data);
  font-size: 8.5px;
  letter-spacing: .11em;
  text-transform: uppercase;
}

.pro-ticket-field b {
  display: block;
  margin-top: 3px;
  font-size: 12.5px;
  font-weight: 650;
  line-height: 1.35;
  overflow-wrap: anywhere;
}

.pro-ticket-note {
  margin-top: 11px;
  padding: 9px 10px;
  border-radius: 10px;
  background: var(--surface-2);
  color: var(--ink-dim);
  font-size: 11.5px;
  line-height: 1.45;
}

.pro-ticket-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 11px;
}

/* -------------------------------------------------------------------------- */
/* GASTOS E ACERTO DO CASAL                                                    */
/* -------------------------------------------------------------------------- */

.pro-money-hero {
  border: 1px solid var(--rule);
  border-radius: var(--pro-radius-lg);
  padding: 17px;
  background:
    radial-gradient(circle at 95% 5%, color-mix(in srgb, var(--verdigris) 19%, transparent), transparent 32%),
    var(--surface);
}

.pro-money-total-label {
  font-family: var(--data);
  font-size: 9.5px;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--ink-dim);
}

.pro-money-total {
  margin-top: 6px;
  font-family: var(--display);
  font-size: 38px;
  line-height: 1;
}

.pro-money-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin-top: 15px;
}

.pro-money-cell {
  padding: 11px;
  border-radius: 12px;
  background: var(--surface-2);
}

.pro-money-cell span {
  display: block;
  color: var(--ink-dim);
  font-size: 10px;
}

.pro-money-cell b {
  display: block;
  margin-top: 4px;
  font-family: var(--data);
  font-size: 14px;
}

.pro-balance-banner {
  margin-top: 10px;
  padding: 11px 12px;
  border-radius: 12px;
  background: color-mix(in srgb, var(--pro-info) 11%, var(--surface-2));
  border: 1px solid color-mix(in srgb, var(--pro-info) 35%, var(--rule));
  font-size: 12px;
  line-height: 1.45;
}

.pro-expense-list {
  display: grid;
  gap: 8px;
}

.pro-expense {
  display: grid;
  grid-template-columns: 38px minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  padding: 11px;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 13px;
}

.pro-expense-icon {
  width: 38px;
  height: 38px;
  border-radius: 11px;
  background: var(--surface-2);
  display: grid;
  place-items: center;
  font-size: 16px;
}

.pro-expense-main {
  min-width: 0;
}

.pro-expense-title {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 13px;
  font-weight: 700;
}

.pro-expense-meta {
  margin-top: 2px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--ink-dim);
  font-size: 10.5px;
}

.pro-expense-amount {
  text-align: right;
  font-family: var(--data);
  font-size: 13px;
  font-weight: 750;
}

.pro-expense-amount small {
  display: block;
  margin-top: 2px;
  color: var(--ink-dim);
  font-size: 8.5px;
  font-weight: 500;
}

.pro-budget-bars {
  display: grid;
  gap: 9px;
}

.pro-budget-row {
  padding: 10px 11px;
  border: 1px solid var(--rule);
  border-radius: 12px;
  background: var(--surface);
}

.pro-budget-row-head {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 11.5px;
}

.pro-budget-row-head span:last-child {
  font-family: var(--data);
  color: var(--ink-dim);
}

.pro-budget-track {
  height: 6px;
  margin-top: 8px;
  overflow: hidden;
  border-radius: 999px;
  background: var(--surface-2);
}

.pro-budget-fill {
  height: 100%;
  border-radius: inherit;
  background: var(--verdigris);
  transition: width .25s ease;
}

.pro-budget-fill.over {
  background: var(--pompeii);
}

/* -------------------------------------------------------------------------- */
/* CHECKLIST                                                                   */
/* -------------------------------------------------------------------------- */

.pro-check-progress {
  padding: 14px;
  border-radius: 15px;
  border: 1px solid var(--rule);
  background: var(--surface);
  margin-bottom: 13px;
}

.pro-check-progress-head {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: baseline;
}

.pro-check-progress-head strong {
  font-family: var(--display);
  font-size: 18px;
}

.pro-check-progress-head span {
  color: var(--ink-dim);
  font-family: var(--data);
  font-size: 10px;
}

.pro-check-group {
  border: 1px solid var(--rule);
  border-radius: 15px;
  background: var(--surface);
  overflow: hidden;
  margin-bottom: 10px;
}

.pro-check-group-head {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 13px;
  text-align: left;
}

.pro-check-group-title {
  display: flex;
  align-items: center;
  gap: 9px;
  font-weight: 750;
  font-size: 13px;
}

.pro-check-group-count {
  font-family: var(--data);
  font-size: 9.5px;
  color: var(--ink-dim);
}

.pro-check-items {
  border-top: 1px solid var(--rule);
}

.pro-check-item {
  display: grid;
  grid-template-columns: 28px minmax(0, 1fr) auto;
  gap: 9px;
  align-items: center;
  padding: 11px 13px;
  border-bottom: 1px solid color-mix(in srgb, var(--rule) 65%, transparent);
}

.pro-check-item:last-child {
  border-bottom: 0;
}

.pro-check-box {
  width: 24px;
  height: 24px;
  border-radius: 8px;
  border: 1.5px solid var(--rule);
  background: var(--surface-2);
  display: grid;
  place-items: center;
  font-size: 12px;
}

.pro-check-item.is-done .pro-check-box {
  background: var(--verdigris);
  border-color: var(--verdigris);
  color: #0E1814;
}

.pro-check-copy {
  min-width: 0;
}

.pro-check-copy b {
  display: block;
  font-size: 12.5px;
  line-height: 1.35;
}

.pro-check-copy small {
  display: block;
  margin-top: 2px;
  color: var(--ink-dim);
  font-size: 10.5px;
  line-height: 1.35;
}

.pro-check-item.is-done .pro-check-copy {
  opacity: .55;
}

.pro-check-item.is-done .pro-check-copy b {
  text-decoration: line-through;
}

.pro-check-remove {
  width: 30px;
  height: 30px;
  border-radius: 9px;
  color: var(--ink-dim);
}

/* -------------------------------------------------------------------------- */
/* GUIA RÁPIDO / FRASES / FAVORITOS                                           */
/* -------------------------------------------------------------------------- */

.pro-guide-grid {
  display: grid;
  gap: 10px;
}

.pro-guide-card {
  padding: 13px;
  border: 1px solid var(--rule);
  border-radius: 14px;
  background: var(--surface);
}

.pro-guide-card h4 {
  margin: 0;
  font-family: var(--display);
  font-size: 16px;
}

.pro-guide-card p {
  margin: 6px 0 0;
  color: var(--ink-dim);
  font-size: 11.5px;
  line-height: 1.5;
}

.pro-phrase-list {
  display: grid;
  gap: 7px;
}

.pro-phrase {
  width: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
  padding: 11px 12px;
  border: 1px solid var(--rule);
  border-radius: 12px;
  background: var(--surface);
  text-align: left;
}

.pro-phrase-pt {
  color: var(--ink-dim);
  font-size: 10.5px;
}

.pro-phrase-it {
  display: block;
  margin-top: 2px;
  font-size: 13px;
  font-weight: 700;
}

.pro-phrase-copy {
  color: var(--pompeii);
  font-family: var(--data);
  font-size: 9px;
  letter-spacing: .1em;
  text-transform: uppercase;
}

.pro-favorite-list {
  display: grid;
  gap: 8px;
}

.pro-favorite {
  padding: 11px 12px;
  border: 1px solid var(--rule);
  border-radius: 12px;
  background: var(--surface);
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
}

.pro-favorite b {
  display: block;
  font-size: 12.5px;
}

.pro-favorite small {
  display: block;
  margin-top: 2px;
  color: var(--ink-dim);
  font-size: 10px;
}

/* -------------------------------------------------------------------------- */
/* MAIS / CONFIGURAÇÕES                                                        */
/* -------------------------------------------------------------------------- */

.pro-setting-list {
  display: grid;
  gap: 8px;
}

.pro-setting {
  display: grid;
  grid-template-columns: 38px minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  min-height: 62px;
  padding: 10px 12px;
  border: 1px solid var(--rule);
  border-radius: 13px;
  background: var(--surface);
}

.pro-setting-icon {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 11px;
  background: var(--surface-2);
}

.pro-setting-copy {
  min-width: 0;
}

.pro-setting-copy b {
  display: block;
  font-size: 12.5px;
}

.pro-setting-copy small {
  display: block;
  margin-top: 2px;
  color: var(--ink-dim);
  font-size: 10.5px;
  line-height: 1.35;
}

.pro-setting-control {
  flex: none;
}

.pro-switch {
  position: relative;
  width: 44px;
  height: 26px;
  border-radius: 999px;
  background: var(--surface-2);
  border: 1px solid var(--rule);
}

.pro-switch::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--ink-dim);
  transition: left .2s ease, background .2s ease;
}

.pro-switch[aria-pressed="true"] {
  background: color-mix(in srgb, var(--verdigris) 28%, var(--surface-2));
  border-color: var(--verdigris);
}

.pro-switch[aria-pressed="true"]::after {
  left: 21px;
  background: var(--verdigris);
}

/* -------------------------------------------------------------------------- */
/* FORMULÁRIOS / MODAIS                                                        */
/* -------------------------------------------------------------------------- */

.pro-fab {
  position: fixed;
  right: 18px;
  bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);
  z-index: 44;
  min-width: 52px;
  height: 52px;
  padding: 0 16px;
  border-radius: 17px;
  border: 0;
  background: var(--naples);
  color: #1C160A;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  box-shadow: var(--pro-shadow-md);
  font-size: 12px;
  font-weight: 800;
}

.pro-modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  background: rgba(0, 0, 0, .55);
  backdrop-filter: blur(7px);
  -webkit-backdrop-filter: blur(7px);
  padding: 12px;
}

.pro-modal {
  width: min(100%, 600px);
  max-height: min(88dvh, 760px);
  overflow-y: auto;
  border-radius: 22px 22px 18px 18px;
  border: 1px solid var(--rule);
  background: var(--bg);
  box-shadow: var(--pro-shadow-lg);
  animation: proSheetIn .2s ease;
}

@keyframes proSheetIn {
  from {
    transform: translateY(24px);
    opacity: .5;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

.pro-modal-head {
  position: sticky;
  top: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 14px 15px;
  border-bottom: 1px solid var(--rule);
  background: color-mix(in srgb, var(--bg) 94%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.pro-modal-head h3 {
  margin: 0;
  font-family: var(--display);
  font-size: 19px;
}

.pro-modal-close {
  width: 36px;
  height: 36px;
  border-radius: 11px;
  border: 1px solid var(--rule);
  background: var(--surface);
}

.pro-modal-body {
  padding: 15px;
}

.pro-form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.pro-field {
  min-width: 0;
}

.pro-field.full {
  grid-column: 1 / -1;
}

.pro-field label {
  display: block;
  margin-bottom: 5px;
  color: var(--ink-dim);
  font-family: var(--data);
  font-size: 9px;
  letter-spacing: .11em;
  text-transform: uppercase;
}

.pro-field input,
.pro-field select,
.pro-field textarea {
  width: 100%;
  min-height: 43px;
  border-radius: 11px;
  border: 1px solid var(--rule);
  background: var(--surface);
  color: var(--ink);
  padding: 10px 11px;
  font-size: 13px;
}

.pro-field textarea {
  min-height: 86px;
}

.pro-form-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 15px;
}

.pro-empty {
  padding: 28px 18px;
  border: 1px dashed var(--rule);
  border-radius: 15px;
  text-align: center;
  color: var(--ink-dim);
}

.pro-empty-icon {
  font-size: 28px;
  opacity: .8;
}

.pro-empty b {
  display: block;
  margin-top: 8px;
  color: var(--ink);
  font-family: var(--display);
  font-size: 17px;
}

.pro-empty p {
  margin: 5px auto 0;
  max-width: 380px;
  font-size: 11.5px;
  line-height: 1.5;
}

/* -------------------------------------------------------------------------- */
/* RESPONSIVIDADE                                                              */
/* -------------------------------------------------------------------------- */

@media (min-width: 520px) {
  .pro-kpi-grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .pro-wallet-list {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .pro-guide-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .pro-now-actions {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}

@media (min-width: 720px) {
  :root {
    --pro-content-pad: 24px;
  }

  body {
    max-width: var(--pro-max);
  }

  nav {
    max-width: var(--pro-max);
  }

  .view {
    padding-left: 24px;
    padding-right: 24px;
  }

  .pro-toolbar {
    margin-left: -24px;
    margin-right: -24px;
    padding-left: 24px;
    padding-right: 24px;
  }

  .pro-modal-backdrop {
    align-items: center;
  }

  .pro-modal {
    border-radius: 22px;
  }

  .pro-ticket-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (min-width: 900px) {
  .pro-wallet-list {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media print {
  .top,
  nav,
  .toast,
  .pro-fab,
  .pro-toolbar,
  .day-actions,
  .actions,
  .pro-top-actions,
  .pro-icon-tool,
  .pro-modal-backdrop {
    display: none !important;
  }

  body {
    max-width: none;
    background: white !important;
    color: black !important;
    padding: 0 !important;
  }

  .view {
    display: block !important;
    padding: 12mm !important;
    break-after: page;
  }

  .view:empty {
    display: none !important;
  }

  .card,
  .pro-ticket,
  .pro-expense,
  .pro-check-group,
  .pro-guide-card {
    break-inside: avoid;
    box-shadow: none !important;
  }

  a {
    text-decoration: none !important;
  }
}


/* ========================================================================== */
/* ITALIA TRIP OS 3.0 — APP EXPERIENCE                                        */
/* ========================================================================== */
/* Camada final de experiência: shell de app, timeline sem sobreposição,       */
/* cartões visuais, páginas auxiliares, bottom sheets e componentes offline.    */
/* Mantém os dados do roteiro original como fonte de verdade.                  */
/* ========================================================================== */

:root {
  --app3-shell-max: 980px;
  --app3-nav-max: 720px;
  --app3-time-col: 64px;
  --app3-line-col: 24px;
  --app3-gap: 12px;
  --app3-card-radius: 22px;
  --app3-hero-radius: 28px;
  --app3-sheet-radius: 28px;
  --app3-ease: cubic-bezier(.2,.8,.2,1);
  --app3-shadow-1: 0 10px 30px rgba(0,0,0,.12);
  --app3-shadow-2: 0 22px 70px rgba(0,0,0,.22);
  --app3-glow: color-mix(in srgb, var(--naples) 18%, transparent);
  --app3-glass: color-mix(in srgb, var(--surface) 88%, transparent);
  --app3-card: color-mix(in srgb, var(--surface) 96%, var(--surface-2));
  --app3-soft: color-mix(in srgb, var(--surface-2) 72%, transparent);
  --app3-rome: #B5523F;
  --app3-naples: #D9A62E;
  --app3-pompeii: #9A4939;
  --app3-fiumicino: #527D8A;
  --app3-green: #6C9B83;
  --app3-blue: #7193B7;
  --app3-violet: #8F7AA9;
  --app3-danger: #C05A4D;
  --app3-warning: #D3A33E;
}

html {
  background: var(--bg);
}

body {
  width: 100%;
  max-width: var(--app3-shell-max);
  margin-inline: auto;
  overflow-x: clip;
}

body.app3-sheet-open {
  overflow: hidden;
}

body.app3-focus-mode nav {
  transform: translateY(115%);
}

body.app3-focus-mode .top {
  transform: translateY(-110%);
}

body.app3-focus-mode .view.active {
  padding-top: 12px;
}

.top {
  transition: transform .26s var(--app3-ease), background .2s ease;
  border-bottom-color: color-mix(in srgb, var(--rule) 58%, transparent);
}

.app3-top-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.app3-top-city {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 26px;
  padding: 4px 8px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: color-mix(in srgb, var(--surface) 82%, transparent);
  color: var(--ink-dim);
  font-family: var(--data);
  font-size: 9px;
  letter-spacing: .08em;
  text-transform: uppercase;
  white-space: nowrap;
}

.app3-top-city::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--naples);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--naples) 14%, transparent);
}

.app3-top-actions {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-left: auto;
}

.app3-header-btn {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border: 1px solid var(--rule);
  border-radius: 12px;
  background: var(--app3-glass);
  color: var(--ink);
  transition: transform .15s ease, background .2s ease;
}

.app3-header-btn:active {
  transform: scale(.93);
}

.app3-header-btn svg {
  width: 18px;
  height: 18px;
}

/* -------------------------------------------------------------------------- */
/* BOTTOM NAV — aparência de aplicativo                                        */
/* -------------------------------------------------------------------------- */

nav {
  left: 50%;
  right: auto;
  width: min(calc(100% - 18px), var(--app3-nav-max));
  transform: translateX(-50%);
  bottom: calc(8px + env(safe-area-inset-bottom));
  border: 1px solid color-mix(in srgb, var(--rule) 82%, transparent);
  border-radius: 22px;
  overflow: hidden;
  padding: 4px;
  background: color-mix(in srgb, var(--bg) 84%, transparent);
  box-shadow: 0 18px 55px rgba(0,0,0,.30);
  transition: transform .28s var(--app3-ease);
}

nav button {
  position: relative;
  height: 57px;
  border-radius: 17px;
  transition: background .2s ease, color .2s ease, transform .15s ease;
}

nav button:active {
  transform: scale(.96);
}

nav button[aria-selected="true"] {
  background: color-mix(in srgb, var(--surface-2) 86%, transparent);
}

nav button[aria-selected="true"]::before {
  content: "";
  position: absolute;
  top: 3px;
  left: 50%;
  width: 18px;
  height: 2px;
  transform: translateX(-50%);
  border-radius: 99px;
  background: currentColor;
}

nav button i svg {
  width: 19px;
  height: 19px;
}

.view {
  padding-bottom: calc(var(--nav-h) + 52px + env(safe-area-inset-bottom));
}

/* -------------------------------------------------------------------------- */
/* CORREÇÃO DEFINITIVA DA TIMELINE                                             */
/* -------------------------------------------------------------------------- */

.rail {
  position: relative;
  padding-left: 0 !important;
}

.rail::before {
  display: none !important;
}

.stop {
  position: relative;
  display: grid;
  grid-template-columns: var(--app3-time-col) var(--app3-line-col) minmax(0, 1fr);
  column-gap: 0;
  align-items: start;
  margin: 0 0 16px !important;
  scroll-margin-top: 158px;
}

.stop::before {
  content: "";
  position: absolute;
  left: calc(var(--app3-time-col) + (var(--app3-line-col) / 2));
  top: 18px;
  bottom: -21px;
  width: 1px;
  background: linear-gradient(180deg, var(--rule), color-mix(in srgb, var(--rule) 50%, transparent));
  transform: translateX(-.5px);
  z-index: 0;
}

.stop:last-child::before {
  bottom: 16px;
  background: linear-gradient(180deg, var(--rule), transparent);
}

.stop .marker {
  position: static !important;
  grid-column: 1;
  width: auto !important;
  min-width: 0;
  padding: 1px 7px 0 0;
  text-align: right;
  z-index: 2;
}

.stop .mk-time {
  display: block;
  width: 100%;
  font-family: var(--data);
  font-size: 12px;
  line-height: 1.1;
  font-weight: 800;
  letter-spacing: -.03em;
  white-space: nowrap;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}

.stop .mk-dur {
  display: block;
  width: 100%;
  margin-top: 5px;
  color: var(--ink-dim);
  font-family: var(--data);
  font-size: 8.5px;
  line-height: 1.25;
  white-space: normal;
  overflow-wrap: anywhere;
}

.stop .dot {
  position: static !important;
  grid-column: 2;
  grid-row: 1;
  justify-self: center;
  width: 12px;
  height: 12px;
  margin-top: 4px;
  border-radius: 50%;
  z-index: 3;
}

.stop .card {
  grid-column: 3;
  grid-row: 1;
  min-width: 0;
  margin-left: 8px;
  border-radius: var(--app3-card-radius);
  padding: 16px;
  overflow: hidden;
}

.stop > .leg {
  grid-column: 3;
  width: auto;
  margin: 9px 0 0 18px !important;
  padding: 0 !important;
  min-width: 0;
}

.stop .card h3 {
  overflow-wrap: anywhere;
}

.stop .card .loc,
.stop .card .note {
  overflow-wrap: anywhere;
}

.stop[data-state="now"] .card {
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--naples) 50%, transparent), var(--app3-shadow-1);
}

.stop.is-done .card {
  opacity: .55;
}

.app3-time-original {
  display: block;
  margin-top: 4px;
  color: var(--ink-dim);
  font-family: var(--data);
  font-size: 8px;
  letter-spacing: .03em;
  text-decoration: line-through;
  text-decoration-thickness: 1px;
}

.app3-time-shifted {
  color: var(--naples);
}

/* -------------------------------------------------------------------------- */
/* DELAY BAR — responsiva e sem recorte                                        */
/* -------------------------------------------------------------------------- */

.pro-delay-bar {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  margin-bottom: 18px;
  padding: 14px 15px;
  border-radius: 18px;
  box-shadow: inset 0 1px 0 color-mix(in srgb, white 3%, transparent);
}

.pro-delay-copy b {
  font-size: 14px;
  line-height: 1.25;
}

.pro-delay-copy small {
  max-width: 420px;
  font-size: 11.5px;
  line-height: 1.4;
}

.pro-delay-controls {
  gap: 6px;
}

.pro-delay-btn {
  width: 38px;
  height: 38px;
  border-radius: 12px;
}

.pro-delay-value {
  min-width: 72px;
  font-size: 10.5px;
}

/* -------------------------------------------------------------------------- */
/* APP HERO / POSTCARD                                                         */
/* -------------------------------------------------------------------------- */

.app3-hero {
  position: relative;
  min-height: 300px;
  margin: -4px 0 18px;
  border: 1px solid var(--rule);
  border-radius: var(--app3-hero-radius);
  overflow: hidden;
  isolation: isolate;
  background: var(--surface);
  box-shadow: var(--app3-shadow-1);
}

.app3-hero-bg {
  position: absolute;
  inset: 0;
  z-index: -3;
  overflow: hidden;
}

.app3-hero-bg svg {
  width: 100%;
  height: 100%;
  display: block;
}

.app3-hero-shade {
  position: absolute;
  inset: 0;
  z-index: -2;
  background:
    linear-gradient(180deg, rgba(10,10,10,.06) 0%, rgba(10,10,10,.32) 55%, rgba(10,10,10,.84) 100%),
    linear-gradient(90deg, rgba(10,10,10,.45), transparent 70%);
}

html[data-theme="light"] .app3-hero-shade {
  background:
    linear-gradient(180deg, rgba(15,10,5,.02) 0%, rgba(15,10,5,.20) 50%, rgba(15,10,5,.72) 100%),
    linear-gradient(90deg, rgba(15,10,5,.24), transparent 72%);
}

.app3-hero-content {
  position: absolute;
  inset: auto 0 0;
  padding: 22px;
  color: #FFF8EE;
}

.app3-hero-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 6px 9px;
  border: 1px solid rgba(255,255,255,.24);
  border-radius: 999px;
  background: rgba(16,14,11,.30);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  font-family: var(--data);
  font-size: 9px;
  letter-spacing: .14em;
  text-transform: uppercase;
}

.app3-hero-title {
  margin: 12px 0 0;
  max-width: 620px;
  font-family: var(--display);
  font-size: clamp(31px, 8vw, 48px);
  line-height: .98;
  letter-spacing: -.025em;
  text-wrap: balance;
}

.app3-hero-sub {
  margin-top: 10px;
  max-width: 520px;
  color: rgba(255,248,238,.82);
  font-size: 12.5px;
  line-height: 1.5;
}

.app3-hero-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 14px;
}

.app3-glass-pill {
  min-height: 30px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 9px;
  border: 1px solid rgba(255,255,255,.18);
  border-radius: 999px;
  background: rgba(16,14,11,.28);
  backdrop-filter: blur(9px);
  -webkit-backdrop-filter: blur(9px);
  font-size: 10.5px;
  color: #FFF8EE;
}

.app3-hero-top-actions {
  position: absolute;
  top: 14px;
  right: 14px;
  display: flex;
  gap: 7px;
}

.app3-glass-btn {
  min-width: 38px;
  height: 38px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 0 11px;
  border: 1px solid rgba(255,255,255,.20);
  border-radius: 13px;
  background: rgba(16,14,11,.30);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: #FFF8EE;
  font-size: 11px;
  font-weight: 750;
}

/* -------------------------------------------------------------------------- */
/* CITY STORY CAROUSEL                                                        */
/* -------------------------------------------------------------------------- */

.app3-story-strip {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(185px, 68%);
  gap: 10px;
  overflow-x: auto;
  overscroll-behavior-x: contain;
  scroll-snap-type: x proximity;
  scrollbar-width: none;
  margin: 0 -18px;
  padding: 2px 18px 7px;
}

.app3-story-strip::-webkit-scrollbar {
  display: none;
}

.app3-story-card {
  position: relative;
  min-height: 190px;
  scroll-snap-align: start;
  border: 1px solid var(--rule);
  border-radius: 20px;
  overflow: hidden;
  background: var(--surface);
  text-align: left;
  color: #FFF8EE;
  box-shadow: var(--app3-shadow-1);
}

.app3-story-art {
  position: absolute;
  inset: 0;
}

.app3-story-art svg {
  width: 100%;
  height: 100%;
}

.app3-story-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 25%, rgba(12,10,8,.85) 100%);
}

.app3-story-copy {
  position: absolute;
  left: 14px;
  right: 14px;
  bottom: 13px;
}

.app3-story-copy small {
  font-family: var(--data);
  font-size: 8.5px;
  letter-spacing: .14em;
  text-transform: uppercase;
  opacity: .78;
}

.app3-story-copy b {
  display: block;
  margin-top: 4px;
  font-family: var(--display);
  font-size: 19px;
  line-height: 1.05;
}

.app3-story-progress {
  height: 3px;
  margin-top: 9px;
  border-radius: 99px;
  overflow: hidden;
  background: rgba(255,255,255,.22);
}

.app3-story-progress i {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: #FFF8EE;
}

/* -------------------------------------------------------------------------- */
/* SMART SUMMARY                                                               */
/* -------------------------------------------------------------------------- */

.app3-smart-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.app3-smart-card {
  min-width: 0;
  min-height: 126px;
  padding: 14px;
  border: 1px solid var(--rule);
  border-radius: 18px;
  background: linear-gradient(145deg, var(--surface), var(--surface-2));
  box-shadow: inset 0 1px 0 color-mix(in srgb, white 3%, transparent);
}

.app3-smart-icon {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border-radius: 11px;
  background: color-mix(in srgb, var(--naples) 12%, var(--surface-2));
  font-size: 16px;
}

.app3-smart-card strong {
  display: block;
  margin-top: 10px;
  font-family: var(--display);
  font-size: 20px;
  line-height: 1.05;
}

.app3-smart-card small {
  display: block;
  margin-top: 5px;
  color: var(--ink-dim);
  font-size: 10.5px;
  line-height: 1.4;
}

/* -------------------------------------------------------------------------- */
/* DAY VISUAL HEADER                                                           */
/* -------------------------------------------------------------------------- */

.app3-day-visual {
  position: relative;
  min-height: 196px;
  margin-bottom: 13px;
  border: 1px solid var(--rule);
  border-radius: 24px;
  overflow: hidden;
  color: #FFF8EE;
}

.app3-day-visual-art {
  position: absolute;
  inset: 0;
}

.app3-day-visual-art svg {
  width: 100%;
  height: 100%;
}

.app3-day-visual::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(10,8,6,.02), rgba(10,8,6,.82));
}

.app3-day-visual-copy {
  position: absolute;
  z-index: 2;
  left: 16px;
  right: 16px;
  bottom: 15px;
}

.app3-day-visual-copy small {
  font-family: var(--data);
  font-size: 8.5px;
  letter-spacing: .14em;
  text-transform: uppercase;
  opacity: .8;
}

.app3-day-visual-copy h2 {
  margin: 5px 0 0;
  font-family: var(--display);
  font-size: 25px;
  line-height: 1.04;
}

.app3-day-visual-copy p {
  margin: 6px 0 0;
  max-width: 560px;
  color: rgba(255,248,238,.82);
  font-size: 11px;
}

/* -------------------------------------------------------------------------- */
/* STOP CARD 3.0                                                               */
/* -------------------------------------------------------------------------- */

.app3-stop-cover {
  position: relative;
  height: 78px;
  margin: -16px -16px 13px;
  overflow: hidden;
  border-bottom: 1px solid var(--rule);
  background: var(--surface-2);
}

.app3-stop-cover svg {
  width: 100%;
  height: 100%;
  display: block;
}

.app3-stop-cover::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--surface) 34%, transparent));
}

.app3-stop-card-top {
  display: flex;
  align-items: center;
  gap: 8px;
}

.app3-category-icon {
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 10px;
  flex: none;
  background: color-mix(in srgb, var(--naples) 10%, var(--surface-2));
  color: var(--naples);
}

.app3-category-icon svg {
  width: 15px;
  height: 15px;
}

.app3-stop-card-top .cat {
  flex: 1;
  margin: 0;
}

.app3-stop-primary-actions {
  display: grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: 8px;
  margin-top: 12px;
}

.app3-stop-primary-actions .btn {
  justify-content: center;
}

.app3-detail-btn {
  background: color-mix(in srgb, var(--naples) 12%, var(--surface-2));
  border-color: color-mix(in srgb, var(--naples) 35%, var(--rule));
}

/* -------------------------------------------------------------------------- */
/* APP PAGE SHELLS                                                             */
/* -------------------------------------------------------------------------- */

.app3-page {
  animation: app3PageIn .28s var(--app3-ease);
}

@keyframes app3PageIn {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

.app3-page-back {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  min-height: 38px;
  margin-bottom: 14px;
  padding: 7px 11px;
  border: 1px solid var(--rule);
  border-radius: 12px;
  background: var(--surface);
  color: var(--ink-dim);
  font-size: 11px;
  font-weight: 700;
}

.app3-page-head {
  margin-bottom: 18px;
}

.app3-page-kicker {
  color: var(--ink-dim);
  font-family: var(--data);
  font-size: 9px;
  letter-spacing: .16em;
  text-transform: uppercase;
}

.app3-page-title {
  margin: 5px 0 0;
  font-family: var(--display);
  font-size: clamp(30px, 8vw, 44px);
  line-height: 1;
  letter-spacing: -.025em;
}

.app3-page-desc {
  margin: 8px 0 0;
  max-width: 640px;
  color: var(--ink-dim);
  font-size: 12.5px;
  line-height: 1.5;
}

/* -------------------------------------------------------------------------- */
/* SECTION CARDS / LISTS                                                       */
/* -------------------------------------------------------------------------- */

.app3-section {
  margin-top: 24px;
}

.app3-section-head {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}

.app3-section-head h3 {
  margin: 0;
  font-family: var(--display);
  font-size: 20px;
  line-height: 1.1;
}

.app3-section-head span {
  color: var(--ink-dim);
  font-family: var(--data);
  font-size: 8.5px;
  letter-spacing: .12em;
  text-transform: uppercase;
}

.app3-list {
  display: grid;
  gap: 9px;
}

.app3-list-card {
  display: grid;
  grid-template-columns: auto minmax(0,1fr) auto;
  align-items: center;
  gap: 11px;
  width: 100%;
  min-height: 72px;
  padding: 11px 12px;
  border: 1px solid var(--rule);
  border-radius: 16px;
  background: var(--surface);
  text-align: left;
}

.app3-list-icon {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: var(--surface-2);
  font-size: 17px;
}

.app3-list-copy {
  min-width: 0;
}

.app3-list-copy b {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 13px;
}

.app3-list-copy small {
  display: block;
  margin-top: 3px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--ink-dim);
  font-size: 10.5px;
}

.app3-list-end {
  color: var(--ink-dim);
  font-family: var(--data);
  font-size: 10px;
}

/* -------------------------------------------------------------------------- */
/* DISCOVER / CITY CARDS                                                       */
/* -------------------------------------------------------------------------- */

.app3-city-grid {
  display: grid;
  gap: 12px;
}

.app3-city-card {
  position: relative;
  min-height: 245px;
  overflow: hidden;
  border: 1px solid var(--rule);
  border-radius: 24px;
  background: var(--surface);
  color: #FFF8EE;
  box-shadow: var(--app3-shadow-1);
}

.app3-city-card-art {
  position: absolute;
  inset: 0;
}

.app3-city-card-art svg {
  width: 100%;
  height: 100%;
}

.app3-city-card::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 16%, rgba(13,10,8,.88) 100%);
}

.app3-city-card-copy {
  position: absolute;
  z-index: 2;
  left: 17px;
  right: 17px;
  bottom: 16px;
}

.app3-city-card-copy small {
  font-family: var(--data);
  font-size: 8.5px;
  letter-spacing: .14em;
  text-transform: uppercase;
  opacity: .8;
}

.app3-city-card-copy h3 {
  margin: 5px 0 0;
  font-family: var(--display);
  font-size: 27px;
  line-height: 1;
}

.app3-city-card-copy p {
  margin: 7px 0 0;
  max-width: 580px;
  color: rgba(255,248,238,.82);
  font-size: 11px;
  line-height: 1.45;
}

.app3-city-card-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}

.app3-city-card-tag {
  padding: 5px 8px;
  border: 1px solid rgba(255,255,255,.16);
  border-radius: 999px;
  background: rgba(18,15,12,.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  font-size: 9.5px;
}

/* -------------------------------------------------------------------------- */
/* FOOD GUIDE                                                                  */
/* -------------------------------------------------------------------------- */

.app3-food-grid {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 10px;
}

.app3-food-card {
  min-width: 0;
  padding: 14px;
  border: 1px solid var(--rule);
  border-radius: 18px;
  background: var(--surface);
}

.app3-food-visual {
  height: 82px;
  display: grid;
  place-items: center;
  margin-bottom: 12px;
  border-radius: 14px;
  overflow: hidden;
  background:
    radial-gradient(circle at 30% 30%, color-mix(in srgb, var(--naples) 32%, transparent), transparent 44%),
    var(--surface-2);
  font-size: 38px;
}

.app3-food-card b {
  display: block;
  font-family: var(--display);
  font-size: 17px;
  line-height: 1.08;
}

.app3-food-card small {
  display: block;
  margin-top: 5px;
  color: var(--ink-dim);
  font-size: 10px;
  line-height: 1.4;
}

.app3-food-meta {
  margin-top: 9px;
  color: var(--naples);
  font-family: var(--data);
  font-size: 8.5px;
  letter-spacing: .08em;
  text-transform: uppercase;
}

/* -------------------------------------------------------------------------- */
/* DOCUMENT CENTER                                                             */
/* -------------------------------------------------------------------------- */

.app3-doc-summary {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 8px;
  margin-bottom: 16px;
}

.app3-doc-stat {
  padding: 12px 8px;
  border: 1px solid var(--rule);
  border-radius: 16px;
  background: var(--surface);
  text-align: center;
}

.app3-doc-stat strong {
  display: block;
  font-family: var(--display);
  font-size: 23px;
  line-height: 1;
}

.app3-doc-stat small {
  display: block;
  margin-top: 5px;
  color: var(--ink-dim);
  font-family: var(--data);
  font-size: 8px;
  letter-spacing: .08em;
  text-transform: uppercase;
}

.app3-doc-card {
  padding: 13px;
  border: 1px solid var(--rule);
  border-radius: 18px;
  background: var(--surface);
}

.app3-doc-card + .app3-doc-card {
  margin-top: 9px;
}

.app3-doc-head {
  display: flex;
  align-items: start;
  gap: 10px;
}

.app3-doc-check {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  flex: none;
  border: 1px solid var(--rule);
  border-radius: 11px;
  background: var(--surface-2);
  font-weight: 900;
}

.app3-doc-card.is-ready .app3-doc-check {
  border-color: transparent;
  background: var(--app3-green);
  color: #0E1712;
}

.app3-doc-copy {
  min-width: 0;
  flex: 1;
}

.app3-doc-copy b {
  display: block;
  font-size: 13px;
}

.app3-doc-copy small {
  display: block;
  margin-top: 3px;
  color: var(--ink-dim);
  font-size: 10.5px;
  line-height: 1.4;
}

.app3-doc-note {
  width: 100%;
  min-height: 56px;
  margin-top: 10px;
  padding: 9px 10px;
  border: 1px solid var(--rule);
  border-radius: 12px;
  background: var(--surface-2);
  font-size: 11px;
}

/* -------------------------------------------------------------------------- */
/* TRANSPORT HUB                                                               */
/* -------------------------------------------------------------------------- */

.app3-route-card {
  position: relative;
  padding: 14px;
  border: 1px solid var(--rule);
  border-radius: 20px;
  background: var(--surface);
  overflow: hidden;
}

.app3-route-card + .app3-route-card {
  margin-top: 10px;
}

.app3-route-card::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  background: var(--app3-blue);
}

.app3-route-type {
  font-family: var(--data);
  font-size: 8px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-dim);
}

.app3-route-main {
  display: grid;
  grid-template-columns: minmax(0,1fr) auto minmax(0,1fr);
  gap: 8px;
  align-items: center;
  margin-top: 10px;
}

.app3-route-point {
  min-width: 0;
}

.app3-route-point b {
  display: block;
  font-family: var(--display);
  font-size: 22px;
  line-height: 1;
}

.app3-route-point small {
  display: block;
  margin-top: 4px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--ink-dim);
  font-size: 9.5px;
}

.app3-route-arrow {
  color: var(--ink-dim);
  font-family: var(--data);
  font-size: 15px;
}

.app3-route-foot {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 12px;
}

/* -------------------------------------------------------------------------- */
/* DIARY                                                                       */
/* -------------------------------------------------------------------------- */

.app3-diary-day {
  padding: 14px;
  border: 1px solid var(--rule);
  border-radius: 20px;
  background: var(--surface);
}

.app3-diary-day + .app3-diary-day {
  margin-top: 10px;
}

.app3-diary-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.app3-diary-title {
  min-width: 0;
}

.app3-diary-title small {
  display: block;
  color: var(--ink-dim);
  font-family: var(--data);
  font-size: 8.5px;
  letter-spacing: .12em;
  text-transform: uppercase;
}

.app3-diary-title b {
  display: block;
  margin-top: 3px;
  font-family: var(--display);
  font-size: 18px;
}

.app3-rating {
  display: flex;
  gap: 3px;
}

.app3-star {
  width: 27px;
  height: 27px;
  display: grid;
  place-items: center;
  color: var(--ink-dim);
  font-size: 16px;
}

.app3-star.is-on {
  color: var(--naples);
}

.app3-diary-text {
  width: 100%;
  min-height: 92px;
  margin-top: 11px;
  padding: 11px;
  border: 1px solid var(--rule);
  border-radius: 14px;
  background: var(--surface-2);
  font-size: 12px;
  line-height: 1.5;
}

.app3-diary-meta {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 8px;
  margin-top: 8px;
}

.app3-diary-meta input {
  width: 100%;
  min-width: 0;
  padding: 9px 10px;
  border: 1px solid var(--rule);
  border-radius: 12px;
  background: var(--surface-2);
  font-size: 10.5px;
}

/* -------------------------------------------------------------------------- */
/* SAFETY / ESSENTIAL INFO                                                     */
/* -------------------------------------------------------------------------- */

.app3-emergency-hero {
  padding: 18px;
  border: 1px solid color-mix(in srgb, var(--app3-danger) 48%, var(--rule));
  border-radius: 22px;
  background:
    radial-gradient(circle at 90% 10%, color-mix(in srgb, var(--app3-danger) 16%, transparent), transparent 36%),
    var(--surface);
}

.app3-emergency-number {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 15px;
}

.app3-emergency-number strong {
  font-family: var(--display);
  font-size: 56px;
  line-height: .9;
  color: var(--app3-danger);
}

.app3-emergency-number span {
  max-width: 180px;
  color: var(--ink-dim);
  font-size: 10.5px;
  line-height: 1.4;
  text-align: right;
}

.app3-info-card {
  padding: 13px;
  border: 1px solid var(--rule);
  border-radius: 17px;
  background: var(--surface);
}

.app3-info-card + .app3-info-card {
  margin-top: 9px;
}

.app3-info-card b {
  display: block;
  font-size: 12.5px;
}

.app3-info-card p {
  margin: 5px 0 0;
  color: var(--ink-dim);
  font-size: 10.5px;
  line-height: 1.45;
}

/* -------------------------------------------------------------------------- */
/* EXPENSE 3.0                                                                 */
/* -------------------------------------------------------------------------- */

.app3-money-chart {
  display: grid;
  grid-template-columns: 124px minmax(0,1fr);
  gap: 16px;
  align-items: center;
  margin: 15px 0;
  padding: 14px;
  border: 1px solid var(--rule);
  border-radius: 20px;
  background: var(--surface);
}

.app3-donut {
  position: relative;
  width: 118px;
  aspect-ratio: 1;
  border-radius: 50%;
  background: conic-gradient(
    var(--naples) 0 var(--app3-p1,0%),
    var(--verdigris) var(--app3-p1,0%) var(--app3-p2,0%),
    var(--app3-blue) var(--app3-p2,0%) var(--app3-p3,0%),
    var(--app3-violet) var(--app3-p3,0%) 100%
  );
}

.app3-donut::after {
  content: "";
  position: absolute;
  inset: 18px;
  border-radius: 50%;
  background: var(--surface);
}

.app3-donut-label {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: grid;
  place-items: center;
  text-align: center;
}

.app3-donut-label b {
  font-family: var(--display);
  font-size: 17px;
}

.app3-donut-label small {
  display: block;
  margin-top: 2px;
  color: var(--ink-dim);
  font-size: 8px;
}

.app3-chart-list {
  display: grid;
  gap: 7px;
}

.app3-chart-row {
  display: grid;
  grid-template-columns: 8px minmax(0,1fr) auto;
  align-items: center;
  gap: 7px;
  min-width: 0;
  font-size: 10px;
}

.app3-chart-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--naples);
}

.app3-chart-row:nth-child(2) .app3-chart-dot {
  background: var(--verdigris);
}

.app3-chart-row:nth-child(3) .app3-chart-dot {
  background: var(--app3-blue);
}

.app3-chart-row:nth-child(4) .app3-chart-dot {
  background: var(--app3-violet);
}

.app3-chart-name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--ink-dim);
}

.app3-chart-val {
  font-family: var(--data);
  font-size: 9.5px;
}

.app3-quick-expenses {
  display: grid;
  grid-template-columns: repeat(4,minmax(0,1fr));
  gap: 7px;
}

.app3-quick-expense {
  min-width: 0;
  padding: 10px 5px;
  border: 1px solid var(--rule);
  border-radius: 14px;
  background: var(--surface);
  text-align: center;
}

.app3-quick-expense span {
  display: block;
  font-size: 17px;
}

.app3-quick-expense small {
  display: block;
  margin-top: 5px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--ink-dim);
  font-size: 8.5px;
}

/* -------------------------------------------------------------------------- */
/* BOTTOM SHEETS / MODALS                                                      */
/* -------------------------------------------------------------------------- */

.app3-sheet-backdrop {
  position: fixed;
  inset: 0;
  z-index: 120;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 12px;
  background: rgba(8,7,6,.66);
  backdrop-filter: blur(7px);
  -webkit-backdrop-filter: blur(7px);
  animation: app3Fade .18s ease;
}

@keyframes app3Fade {
  from { opacity: 0; }
  to { opacity: 1; }
}

.app3-sheet {
  width: min(100%, 700px);
  max-height: min(88dvh, 860px);
  overflow-y: auto;
  overscroll-behavior: contain;
  border: 1px solid var(--rule);
  border-radius: var(--app3-sheet-radius) var(--app3-sheet-radius) 18px 18px;
  background: var(--bg);
  box-shadow: var(--app3-shadow-2);
  animation: app3SheetIn .26s var(--app3-ease);
}

@keyframes app3SheetIn {
  from {
    opacity: 0;
    transform: translateY(36px) scale(.985);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

.app3-sheet-handle {
  width: 38px;
  height: 4px;
  margin: 9px auto 4px;
  border-radius: 99px;
  background: var(--rule);
}

.app3-sheet-cover {
  position: relative;
  height: 190px;
  overflow: hidden;
}

.app3-sheet-cover svg {
  width: 100%;
  height: 100%;
}

.app3-sheet-cover::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 25%, var(--bg) 100%);
}

.app3-sheet-close {
  position: absolute;
  z-index: 3;
  top: 14px;
  right: 14px;
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(255,255,255,.18);
  border-radius: 13px;
  background: rgba(12,10,8,.34);
  backdrop-filter: blur(8px);
  color: #FFF8EE;
  font-size: 18px;
}

.app3-sheet-body {
  position: relative;
  margin-top: -45px;
  padding: 0 18px 22px;
