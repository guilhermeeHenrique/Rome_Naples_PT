  z-index: 2;
}

.app3-sheet-kicker {
  color: var(--naples);
  font-family: var(--data);
  font-size: 9px;
  letter-spacing: .14em;
  text-transform: uppercase;
}

.app3-sheet-title {
  margin: 6px 0 0;
  max-width: 600px;
  font-family: var(--display);
  font-size: 31px;
  line-height: 1.02;
  letter-spacing: -.02em;
}

.app3-sheet-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 12px;
}

.app3-sheet-section {
  margin-top: 18px;
  padding-top: 15px;
  border-top: 1px solid var(--rule);
}

.app3-sheet-section h4 {
  margin: 0 0 7px;
  font-family: var(--display);
  font-size: 17px;
}

.app3-sheet-section p {
  margin: 0;
  color: var(--ink-dim);
  font-size: 11.5px;
  line-height: 1.55;
}

.app3-sheet-actions {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 8px;
  margin-top: 16px;
}

.app3-sheet-note {
  width: 100%;
  min-height: 76px;
  padding: 10px;
  border: 1px solid var(--rule);
  border-radius: 13px;
  background: var(--surface);
  font-size: 11.5px;
}

/* -------------------------------------------------------------------------- */
/* TOAST 3.0                                                                   */
/* -------------------------------------------------------------------------- */

.toast {
  bottom: calc(var(--nav-h) + 30px + env(safe-area-inset-bottom));
  max-width: calc(100% - 30px);
  overflow: hidden;
  text-overflow: ellipsis;
  border: 1px solid color-mix(in srgb, var(--rule) 60%, transparent);
  box-shadow: var(--app3-shadow-2);
}

/* -------------------------------------------------------------------------- */
/* ACCESSIBILITY / TOUCH                                                       */
/* -------------------------------------------------------------------------- */

.app3-touch {
  min-height: 44px;
}

.app3-muted {
  color: var(--ink-dim);
}

.app3-accent {
  color: var(--naples);
}

.app3-danger {
  color: var(--app3-danger);
}

.app3-divider {
  height: 1px;
  margin: 18px 0;
  background: var(--rule);
}

.app3-chip-row {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  scrollbar-width: none;
  margin-inline: -18px;
  padding-inline: 18px;
}

.app3-chip-row::-webkit-scrollbar {
  display: none;
}

.app3-chip {
  flex: none;
  min-height: 36px;
  padding: 8px 11px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink-dim);
  font-size: 10px;
  font-weight: 700;
}

.app3-chip.is-active {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--bg);
}

/* -------------------------------------------------------------------------- */
/* RESPONSIVIDADE 3.0                                                          */
/* -------------------------------------------------------------------------- */

@media (max-width: 430px) {
  :root {
    --app3-time-col: 58px;
    --app3-line-col: 22px;
  }

  .stop .marker {
    padding-right: 5px;
  }

  .stop .mk-time {
    font-size: 11px;
  }

  .stop .card {
    margin-left: 6px;
    padding: 14px;
    border-radius: 19px;
  }

  .app3-stop-cover {
    margin: -14px -14px 12px;
  }

/* ================================================================
   2. PERSISTÊNCIA
   Funciona tanto no arquivo aberto direto no navegador (localStorage)
   quanto dentro de um Artifact do Claude.ai (window.storage).
   ================================================================ */
const KEY = "italia2026";
let STATE = {done:{}, budget:{}, notes:{}};

const store = {
  async get(){
    if(window.storage){
      try{ const r = await window.storage.get(KEY); return r ? r.value : null; }catch(e){}
    }
    try{ return localStorage.getItem(KEY); }catch(e){ return null; }
  },
  async set(v){
    if(window.storage){
      try{ await window.storage.set(KEY, v); return; }catch(e){}
    }
    try{ localStorage.setItem(KEY, v); }catch(e){}
  }
};

async function loadState(){
  const raw = await store.get();
  if(raw){ try{ STATE = Object.assign({done:{},budget:{},notes:{}}, JSON.parse(raw)); }catch(e){} }
}
let saveTimer;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=> store.set(JSON.stringify(STATE)), 250);
}

/* ================================================================
   3. TEMPO — estados de cada parada
   ================================================================ */
const now = () => new Date();
function stopDate(day, hhmm){
  const [Y,M,D] = day.date.split("-").map(Number);
  const [h,m] = hhmm.split(":").map(Number);
  return new Date(Y, M-1, D, h, m, 0, 0);
}
function key(day, i){ return day.date + "#" + i; }
function isDone(day, i){ return !!STATE.done[key(day,i)]; }

/* Estado temporal: past | now | next | late | future */
function stopState(day, i){
  const s = day.stops[i];
  const start = stopDate(day, s.t);
  const end = s.end ? stopDate(day, s.end) : new Date(start.getTime() + 30*60000);
  const t = now();
  if(t >= start && t <= end) return "now";
  if(t > end) return isDone(day,i) ? "past" : "late";
  // futuro: a próxima não concluída do dia é "next"
  for(let j=0;j<day.stops.length;j++){
    const st = stopDate(day, day.stops[j].t);
    if(st > t && !isDone(day,j)) return j===i ? "next" : "future";
  }
  return "future";
}
function todayIndex(){
  const t = now(), iso = t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
  const exact = TRIP.findIndex(d => d.date === iso);
  if(exact >= 0) return exact;
  if(iso < TRIP[0].date) return 0;
  return TRIP.length - 1;
}
function fmtDate(iso){
  const [Y,M,D] = iso.split("-");
  const MES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
  return D + " " + MES[+M-1];
}
function mapsURL(day, s){
  const q = s.q || (s.n + " " + (CITY_Q[day.city] || day.city));
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
}

function renderStops(day){
  return '<div class="rail">' + day.stops.map((s,i)=>{
    const st = stopState(day,i), done = isDone(day,i);
    const dur = s.end ? s.end : "";
    const badge = done ? "" :
      st==="now"  ? '<span class="badge now">agora</span>' :
      st==="next" ? '<span class="badge next">próxima</span>' :
      st==="late" ? '<span class="badge late">atrasada</span>' : "";
    return `
    <div class="stop ${done?"is-done":""}" data-state="${st}">
      <div class="marker">
        <div class="mk-time">${s.t}</div>
        ${dur?`<div class="mk-dur">${dur}</div>`:""}
      </div>
      <div class="dot"></div>
      <div class="card">
        <div class="cat"><span>${ICON[s.cat]||ICON.marco}</span>${CATNAME[s.cat]||""}${badge}</div>
        <h3>${s.n}${s.sug?'<span class="sugg">sugestão</span>':""}</h3>
        ${s.loc?`<div class="loc">${s.loc}</div>`:""}
        ${s.note?`<div class="note ${s.tip?"tip":""}">${s.note}</div>`:""}
        <div class="actions">
          <button class="btn done" data-done="${key(day,i)}" aria-pressed="${done}">
            ${done?"✓ Concluído":"Marcar concluído"}
          </button>
          ${s.nomap?"":`<a class="btn maps" href="${mapsURL(day,s)}" target="_blank" rel="noopener">${NAVICON.mapa} Maps</a>
          <button class="btn icon-only" data-copy="${escAttr(s.loc||s.q||s.n)}" aria-label="Copiar endereço">${ICON_COPY}</button>`}
        </div>
      </div>
    </div>
    ${s.leg?`<div class="leg">${s.leg}</div>`:""}`;
  }).join("") + '</div>';
}

function renderDay(day){
  const idx = TRIP.indexOf(day);
  const total = day.stops.length;
  const done = day.stops.filter((_,i)=>isDone(day,i)).length;
  const pct = total ? Math.round(done/total*100) : 0;
  return `
    <div class="dayhero">
      <div class="hero-art">${HERO[day.city]||HERO["Roma"]}</div>
      <div class="dh-inner">
        <div class="dh-meta">${day.wd} · ${fmtDate(day.date)} · ${day.city}</div>
        <h2>${day.title}</h2>
        ${day.sub?`<div class="dh-tag">${day.sub}</div>`:""}
        <div class="progress">
          <div class="bar"><i style="width:${pct}%"></i></div>
          <div class="lbl"><span>${done} de ${total} concluídos</span><span>${pct}%</span></div>
        </div>
      </div>
    </div>
    <div class="day-actions">
      <button class="btn" data-share="${idx}">${ICON_SHARE} Compartilhar</button>
      <button class="btn" data-ics="${idx}">${ICON_CAL} Calendário</button>

        placeholder="O que aconteceu, o que comeram, o que mudar amanhã…">${STATE.notes[day.date]||""}</textarea>

}

function bval(date, cat, kind){
  const k = date+"#"+cat+"#"+kind;
  if(STATE.budget[k] !== undefined) return STATE.budget[k];
  if(kind==="est" && BSEED[date] && BSEED[date][cat] !== undefined) return BSEED[date][cat];
  return "";
}
function renderOrcamento(){
  let estT=0, realT=0;
  TRIP.forEach(d => BCATS.forEach(([c])=>{
    estT += parseFloat(bval(d.date,c,"est"))||0;
    realT += parseFloat(bval(d.date,c,"real"))||0;
  }));
  const diff = realT - estT;
  const diffTxt = realT===0 ? "Ainda sem gastos reais lançados."
    : diff > 0 ? `€${diff.toFixed(2)} acima do previsto.`
    : diff < 0 ? `€${Math.abs(diff).toFixed(2)} abaixo do previsto.`
    : "Exatamente no previsto.";

  const days = TRIP.map(d=>{
    let dE=0,dR=0;
    BCATS.forEach(([c])=>{dE+=parseFloat(bval(d.date,c,"est"))||0; dR+=parseFloat(bval(d.date,c,"real"))||0;});
    return `
    <div class="bday">
      <h4>${fmtDate(d.date)} · ${d.city}<em>est €${dE.toFixed(0)} · real €${dR.toFixed(0)}</em></h4>

          <input type="number" inputmode="decimal" min="0" step="0.5" placeholder="0"

        </div>`).join("")}
    </div>`;
  }).join("");

  document.getElementById("view-orcamento").innerHTML = `
    <div class="total">
      <div class="t-lbl">Total da viagem · euros</div>
      <div class="t-grid">
        <div class="t-val">€${estT.toFixed(0)}<small>Previsto</small></div>
        <div class="t-val" style="color:var(--naples)">€${realT.toFixed(0)}<small>Real</small></div>

}

/* Contagem regressiva para a próxima parada não concluída */
function renderCountdown(){
  const el = document.getElementById("countdown");
  const day = TRIP[todayIndex()];
  const t = now();
  const iso = t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
  if(iso !== day.date){ el.hidden = true; return; }

  let next = null, late = null;
  day.stops.forEach((s,i)=>{
    if(isDone(day,i)) return;
    const st = stopDate(day,s.t);
    if(st > t){ if(!next) next = {s,st}; }
    else { const end = s.end ? stopDate(day,s.end) : new Date(st.getTime()+30*60000);
           if(t > end) late = {s,st}; }
  });

  if(late && !next){
    el.hidden = false; el.classList.add("is-late");
    document.getElementById("cdTime").textContent = "!";
    document.getElementById("cdName").textContent = late.s.n;
    document.getElementById("cdSub").textContent = "Estava previsto às " + late.s.t + " e não foi marcado";
    return;
  }
  if(!next){ el.hidden = true; return; }

  const ms = next.st - t, mins = Math.floor(ms/60000);
  const h = Math.floor(mins/60), m = mins%60;
  el.hidden = false;
  el.classList.toggle("is-late", !!late);
  document.getElementById("cdTime").textContent = h > 0 ? `${h}h${String(m).padStart(2,"0")}` : `${m}min`;
  document.getElementById("cdName").textContent = next.s.n;
  document.getElementById("cdSub").textContent = late
    ? "Próxima às " + next.s.t + " · há paradas atrasadas"
    : "Próxima às " + next.s.t;
}

/* ================================================================
   5. AÇÕES — compartilhar, calendário (.ics), copiar, avisos
   ================================================================ */
function escAttr(s){ return String(s||"").replace(/"/g,"&quot;"); }

let toastTimer;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove("show"), 1900);
}

function copyAddr(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast("Endereço copiado")).catch(()=>toast("Não foi possível copiar"));
  } else { toast("Cópia não suportada neste navegador"); }
}

function shareText(day){
  return `${day.title} — ${day.wd}, ${fmtDate(day.date)}\n\n` +
    day.stops.map(s=>`${s.t} · ${s.n}`).join("\n");
}
function shareDay(idx){
  const day = TRIP[idx], text = shareText(day);
  if(navigator.share){
    navigator.share({title:day.title, text}).catch(()=>{});
  } else if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(()=>toast("Roteiro do dia copiado")).catch(()=>toast("Não foi possível compartilhar"));
  } else { toast("Compartilhamento não suportado"); }
}

function pad2(n){ return String(n).padStart(2,"0"); }
function addMinutes(hhmm, mins){
  const [h,m] = hhmm.split(":").map(Number);
  const d = new Date(2000,0,1,h,m+mins);
  return pad2(d.getHours())+":"+pad2(d.getMinutes());
}
function icsDate(day, hhmm){
  const [Y,M,D] = day.date.split("-");
  const [h,m] = hhmm.split(":");
  return `${Y}${M}${D}T${pad2(h)}${pad2(m)}00`;
}
function icsEscape(s){ return String(s||"").replace(/[\\,;]/g, x=>"\\"+x).replace(/\n/g,"\\n"); }
function buildICS(day){
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Roteiro Italia 2026//PT","CALSCALE:GREGORIAN"];
  day.stops.forEach((s,i)=>{
    const endT = s.end || addMinutes(s.t, 30);
    L.push("BEGIN:VEVENT");
    L.push("UID:"+day.date+"-"+i+"@roteiro-italia");
    L.push("DTSTART:"+icsDate(day,s.t));
    L.push("DTEND:"+icsDate(day,endT));
    L.push("SUMMARY:"+icsEscape(s.n));
    if(s.loc||s.q) L.push("LOCATION:"+icsEscape(s.loc||s.q));
    if(s.note) L.push("DESCRIPTION:"+icsEscape(s.note));
    L.push("END:VEVENT");
  });
  L.push("END:VCALENDAR");
  return L.join("\r\n");
}
function downloadICS(idx){
  const day = TRIP[idx];
  const blob = new Blob([buildICS(day)], {type:"text/calendar;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "roteiro-"+day.date+".ics";
  a.click(); URL.revokeObjectURL(a.href);
  toast("Arquivo de calendário baixado");
}

  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected", b.dataset.view===v));

/* Delegação de eventos — a interface é re-renderizada com frequência */
document.addEventListener("click", e=>{
  const nav = e.target.closest("nav button");
  if(nav){ switchView(nav.dataset.view); return; }

  const dc = e.target.closest(".daychip");
  if(dc){ selDay = +dc.dataset.day; renderRoteiro(); return; }

  const dn = e.target.closest("[data-done]");
  if(dn){
    const k = dn.dataset.done;
    if(STATE.done[k]) delete STATE.done[k]; else STATE.done[k] = 1;
    saveState(); refresh(); return;
  }

  const tp = e.target.closest("[data-tripday]");
  if(tp){ selDay = +tp.dataset.tripday; switchView("roteiro"); return; }

  const sh = e.target.closest("[data-share]");
  if(sh){ shareDay(+sh.dataset.share); return; }

  const ic = e.target.closest("[data-ics]");
  if(ic){ downloadICS(+ic.dataset.ics); return; }

  const cp = e.target.closest("[data-copy]");
  if(cp){ copyAddr(cp.dataset.copy); return; }

  if(e.target.id==="expBtn"){ exportBackup(); return; }
  if(e.target.id==="impBtn"){ document.getElementById("impFile").click(); return; }
});

/* Deslizar entre dias na aba Roteiro */
(function swipeSetup(){
  let x0=null, y0=null;
  const zone = document.getElementById("view-roteiro");
  zone.addEventListener("touchstart", e=>{
    const tt = e.touches[0]; x0 = tt.clientX; y0 = tt.clientY;
  }, {passive:true});
  zone.addEventListener("touchend", e=>{
    if(x0===null) return;
    const tt = e.changedTouches[0];
    const dx = tt.clientX - x0, dy = tt.clientY - y0;
    x0 = null;
    if(Math.abs(dx) < 62 || Math.abs(dy) > 70) return;
    if(dx < 0 && selDay < TRIP.length-1){ selDay++; renderRoteiro(); }
    else if(dx > 0 && selDay > 0){ selDay--; renderRoteiro(); }
  }, {passive:true});
})();

document.addEventListener("input", e=>{
  if(e.target.dataset.note !== undefined){
    STATE.notes[e.target.dataset.note] = e.target.value; saveState();
  }
  if(e.target.dataset.b !== undefined){
    const k = e.target.dataset.b;
    if(e.target.value==="") delete STATE.budget[k]; else STATE.budget[k] = e.target.value;
    saveState();
    // Atualiza só os totais, para não perder o foco do campo em edição
    if(curView==="orcamento") updateBudgetTotals();
  }
});

function updateBudgetTotals(){
  let estT=0, realT=0;
  TRIP.forEach(d => BCATS.forEach(([c])=>{
    estT += parseFloat(bval(d.date,c,"est"))||0;
    realT += parseFloat(bval(d.date,c,"real"))||0;
  }));
  const vals = document.querySelectorAll(".total .t-val");
  if(vals[0]) vals[0].childNodes[0].nodeValue = "€"+estT.toFixed(0);
  if(vals[1]) vals[1].childNodes[0].nodeValue = "€"+realT.toFixed(0);
  const diff = realT - estT;
  const d = document.querySelector(".t-diff");
  if(d) d.textContent = realT===0 ? "Ainda sem gastos reais lançados."
    : diff > 0 ? `€${diff.toFixed(2)} acima do previsto.`
    : diff < 0 ? `€${Math.abs(diff).toFixed(2)} abaixo do previsto.`
    : "Exatamente no previsto.";
}

});

function PRO_escape(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function PRO_money(value){
  const n = Number(value) || 0;
  return new Intl.NumberFormat("pt-BR",{
    style:"currency",
    currency:"EUR",
    minimumFractionDigits:2
  }).format(n);
}

function PRO_minutesLabel(value){
  const n = Number(value) || 0;
  if(n === 0) return "no horário";
  const sign = n > 0 ? "+" : "−";
  return sign + Math.abs(n) + " min";
}

function PRO_dayDelay(day){
  PRO_ensureState();
  return Number(STATE.delays[day.date]) || 0;
}

function PRO_adjustTime(day, hhmm){
  return addMinutes(hhmm, PRO_dayDelay(day));
}

function PRO_stopDate(day, hhmm){
  return stopDate(day, PRO_adjustTime(day, hhmm));
}

function PRO_isSkipped(day,index){
  PRO_ensureState();
  return !!STATE.skipped[key(day,index)];
}

function PRO_isResolved(day,index){
  return isDone(day,index) || PRO_isSkipped(day,index);
}

function PRO_isFavorite(day,index){
  PRO_ensureState();
  return !!STATE.favorites[key(day,index)];
}

function PRO_stopState(day,index){
  const s = day.stops[index];
  const start = PRO_stopDate(day,s.t);
  const end = s.end ? PRO_stopDate(day,s.end) : new Date(start.getTime()+30*60000);
  const current = now();
  if(PRO_isResolved(day,index) && current > end) return "past";
  if(current >= start && current <= end) return "now";
  if(current > end) return "late";
  for(let i=0;i<day.stops.length;i++){
    const candidate = PRO_stopDate(day,day.stops[i].t);
    if(candidate > current && !PRO_isResolved(day,i)) return i===index ? "next" : "future";
  }
  return "future";
}

function PRO_tripStats(){
  let total = 0;
  let done = 0;
  let skipped = 0;
  let favorites = 0;
  TRIP.forEach(day=>{
    day.stops.forEach((stop,index)=>{
      total++;
      if(isDone(day,index)) done++;
      if(PRO_isSkipped(day,index)) skipped++;
      if(PRO_isFavorite(day,index)) favorites++;
    });
  });
  const resolved = done + skipped;
  return {
    total,
    done,
    skipped,
    favorites,
    resolved,
    percent: total ? Math.round(resolved/total*100) : 0
  };
}

function PRO_findNext(){
  const current = now();
  let late = null;
  let next = null;
  TRIP.forEach((day,dayIndex)=>{
    day.stops.forEach((stop,stopIndex)=>{
      if(PRO_isResolved(day,stopIndex)) return;
      const start = PRO_stopDate(day,stop.t);
      const end = stop.end ? PRO_stopDate(day,stop.end) : new Date(start.getTime()+30*60000);
      const payload = {day,dayIndex,stop,stopIndex,start,end};
      if(current >= start && current <= end && !late) late = {...payload,live:true};
      else if(current > end) late = payload;
      else if(start > current && !next) next = payload;
    });
  });
  return {late,next};
}

function PRO_durationUntil(date){
  const diff = date - now();
  if(diff <= 0) return "agora";
  const mins = Math.floor(diff/60000);
  if(mins < 60) return mins + " min";
  const hours = Math.floor(mins/60);
  const remain = mins % 60;
  if(hours < 24) return hours + "h" + String(remain).padStart(2,"0");
  const days = Math.floor(hours/24);
  return days + (days===1 ? " dia" : " dias");
}

function PRO_filterStop(day,stop,index){
  const q = PRO_UI.itineraryQuery.trim().toLowerCase();
  const filter = PRO_UI.itineraryFilter;
  if(filter === "pending" && PRO_isResolved(day,index)) return false;
  if(filter === "favorites" && !PRO_isFavorite(day,index)) return false;
  if(filter === "food" && !["comida","mercado"].includes(stop.cat)) return false;
  if(filter === "transport" && !["voo","transporte"].includes(stop.cat)) return false;
  if(filter === "tickets" && !["marco","museu","igreja"].includes(stop.cat)) return false;
  if(!q) return true;
  const haystack = [stop.n,stop.cat,stop.loc,stop.note,stop.q,day.city,day.title]
    .filter(Boolean)
    .join(" ")
    .toLowerCase();
  return haystack.includes(q);
}

function PRO_todayIso(){
  const d = now();
  return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
}

function PRO_tripPhase(){
  const iso = PRO_todayIso();
  if(iso < TRIP[0].date) return "before";
  if(iso > TRIP[TRIP.length-1].date) return "after";
  if(TRIP.some(day=>day.date===iso)) return "during";
  return "between";
}

function PRO_renderNextCard(){
  const phase = PRO_tripPhase();
  const {late,next} = PRO_findNext();
  const target = late && late.live ? late : next || late;

function PRO_expenseCategory(id){
  return PRO_EXPENSE_CATEGORIES.find(cat=>cat.id===id) || PRO_EXPENSE_CATEGORIES[PRO_EXPENSE_CATEGORIES.length-1];
}

function PRO_expenseStats(){
  PRO_ensureState();
  const names = STATE.settings.names;
  let total = 0;
  let paidMe = 0;
  let paidCompanion = 0;
  let shareMe = 0;
  let shareCompanion = 0;
  const byCategory = {};
  PRO_EXPENSE_CATEGORIES.forEach(cat=>byCategory[cat.id]=0);
  STATE.expenses.forEach(expense=>{
    const amount = Number(expense.amount) || 0;
    const myPercent = Number(expense.splitMe ?? 50);
    total += amount;
    if(expense.payer === "companion") paidCompanion += amount;
    else paidMe += amount;
    shareMe += amount * myPercent / 100;
    shareCompanion += amount * (100-myPercent) / 100;
    if(byCategory[expense.category] === undefined) byCategory[expense.category] = 0;
    byCategory[expense.category] += amount;
  });
  const balanceMe = paidMe - shareMe;
  let settlement = "Sem acerto necessário";
  if(balanceMe > .009) settlement = `${names.companion} deve ${PRO_money(balanceMe)} para ${names.me}`;
  if(balanceMe < -.009) settlement = `${names.me} deve ${PRO_money(Math.abs(balanceMe))} para ${names.companion}`;
  return {total,paidMe,paidCompanion,shareMe,shareCompanion,balanceMe,settlement,byCategory};
}

function PRO_renderBudgetBars(stats){
  return PRO_EXPENSE_CATEGORIES.map(cat=>{
    const spent = stats.byCategory[cat.id] || 0;
    const cap = Number(STATE.settings.budgetCaps[cat.id]) || 0;
    const percent = cap > 0 ? Math.min(100,Math.round(spent/cap*100)) : 0;
    const over = cap > 0 && spent > cap;
    return `

        <div class="pro-budget-row-head">
          <span>${cat.icon} ${cat.label}</span>
          <span>${PRO_money(spent)}${cap?` / ${PRO_money(cap)}`:""}</span>
        </div>
        <div class="pro-budget-track"><div class="pro-budget-fill ${over?"over":""}" style="width:${cap?Math.min(100,spent/cap*100):0}%"></div></div>
      </div>`;
  }).join("");
}

function PRO_allChecklistItems(){
  const base = PRO_CHECKLIST_GROUPS.flatMap(group=>group.items.map(item=>({...item,groupId:group.id})));
  const custom = (STATE.customChecks||[]).map(item=>({...item,groupId:item.groupId||"custom"}));

}

function PRO_checkStats(){
  const all = PRO_allChecklistItems();
  const done = all.filter(item=>STATE.checklist[item.id]).length;
  return {all:all.length,done,percent:all.length?Math.round(done/all.length*100):0};
}

function renderCountdown(){
  PRO_ensureState();
  const el = document.getElementById("countdown");
  const day = TRIP[todayIndex()];
  const current = now();
  const iso = PRO_todayIso();
  if(iso !== day.date){
    el.hidden = true;
    return;
  }
  let next = null;
  let late = null;
  day.stops.forEach((stop,index)=>{
    if(PRO_isResolved(day,index)) return;
    const start = PRO_stopDate(day,stop.t);
    const end = stop.end ? PRO_stopDate(day,stop.end) : new Date(start.getTime()+30*60000);
    if(start > current){
      if(!next) next = {stop,start,index};
    }else if(current > end){
      late = {stop,start,index};
    }
  });
  if(late && !next){
    el.hidden = false;
    el.classList.add("is-late");
    document.getElementById("cdTime").textContent = "!";
    document.getElementById("cdName").textContent = late.stop.n;
    document.getElementById("cdSub").textContent = "Horário ajustado: " + PRO_adjustTime(day,late.stop.t);
    return;
  }
  if(!next){
    el.hidden = true;
    return;
  }
  el.hidden = false;
  el.classList.toggle("is-late",!!late);
  document.getElementById("cdTime").textContent = PRO_durationUntil(next.start);
  document.getElementById("cdName").textContent = next.stop.n;
  document.getElementById("cdSub").textContent = (late?"Há pendências · ":"") + "próxima às " + PRO_adjustTime(day,next.stop.t);
}

async function PRO_toggleWake(){
  try{
    if(PRO_UI.wakeLock){
      await PRO_UI.wakeLock.release();
      PRO_UI.wakeLock = null;
      STATE.settings.wakeRequested = false;
      saveState();
      toast("Tela ativa desativada");
    }else{
      if(!("wakeLock" in navigator)){
        toast("Wake Lock não é suportado neste navegador");
        return;
      }
      PRO_UI.wakeLock = await navigator.wakeLock.request("screen");
      STATE.settings.wakeRequested = true;
      saveState();
      PRO_UI.wakeLock.addEventListener("release",()=>{
        PRO_UI.wakeLock = null;
        if(curView==="mais") PRO_renderMore();
      });
      toast("Tela será mantida acordada");
    }
    if(curView==="mais") PRO_renderMore();
  }catch(error){
    toast("Não foi possível manter a tela ativa");
  }
}

async function PRO_toggleFullscreen(){
  try{
    if(document.fullscreenElement){
      await document.exitFullscreen();
    }else if(document.documentElement.requestFullscreen){
      await document.documentElement.requestFullscreen();
    }else{
      toast("Tela cheia não suportada");
    }
  }catch(error){
    toast("Não foi possível alterar a tela cheia");
  }
}

/* -------------------------------------------------------------------------- */
/* EVENTOS DA CAMADA PROFISSIONAL                                              */
/* -------------------------------------------------------------------------- */

document.addEventListener("click",async event=>{
  const shortcut = event.target.closest("[data-view-shortcut]");
  if(shortcut){
    switchView(shortcut.dataset.viewShortcut);
    return;
  }

  const filter = event.target.closest("[data-pro-filter]");
  if(filter){
    PRO_UI.itineraryFilter = filter.dataset.proFilter;
    renderRoteiro();
    return;
  }

  const clearSearch = event.target.closest("[data-pro-clear-search]");
  if(clearSearch){
    PRO_UI.itineraryQuery = "";
    renderRoteiro();
    return;
  }

  const favorite = event.target.closest("[data-pro-favorite]");
  if(favorite){
    PRO_ensureState();
    const k = favorite.dataset.proFavorite;
    if(STATE.favorites[k]) delete STATE.favorites[k];
    else STATE.favorites[k] = 1;
    saveState();
    refresh();
    return;
  }

  const skip = event.target.closest("[data-pro-skip]");
  if(skip){
    PRO_ensureState();
    const k = skip.dataset.proSkip;
    if(STATE.skipped[k]) delete STATE.skipped[k];
    else STATE.skipped[k] = 1;
    saveState();
    refresh();
    return;
  }

  const copyStop = event.target.closest("[data-pro-copy-stop]");
  if(copyStop){
    const [date,indexRaw] = copyStop.dataset.proCopyStop.split("|");
    const day = TRIP.find(d=>d.date===date);
    const index = Number(indexRaw);
    if(day && day.stops[index]){
      const stop = day.stops[index];
      const text = `${fmtDate(day.date)} · ${PRO_adjustTime(day,stop.t)} · ${stop.n}${stop.loc?`\n${stop.loc}`:""}${stop.note?`\n${stop.note}`:""}`;
      copyAddr(text);
    }
    return;
  }

  const delay = event.target.closest("[data-pro-delay]");
  if(delay){
    PRO_ensureState();
    const date = delay.dataset.date;
    const delta = Number(delay.dataset.proDelay) || 0;
    const current = Number(STATE.delays[date]) || 0;
    STATE.delays[date] = Math.max(-120,Math.min(240,current+delta));
    if(STATE.delays[date]===0) delete STATE.delays[date];
    saveState();
    refresh();
    return;
  }

  const resetDay = event.target.closest("[data-pro-reset-day]");
  if(resetDay){
    const date = resetDay.dataset.proResetDay;
    const proceed = !STATE.settings.confirmReset || confirm(`Resetar o progresso de ${fmtDate(date)}? Notas e favoritos serão preservados.`);
    if(!proceed) return;
    Object.keys(STATE.done).filter(k=>k.startsWith(date+"#")).forEach(k=>delete STATE.done[k]);
    Object.keys(STATE.skipped).filter(k=>k.startsWith(date+"#")).forEach(k=>delete STATE.skipped[k]);
    delete STATE.delays[date];
    saveState();
    refresh();
    toast("Dia resetado");
    return;
  }

  const goStop = event.target.closest("[data-pro-go-stop]");
  if(goStop){
    const [dayIndex,stopIndex] = goStop.dataset.proGoStop.split("|").map(Number);
    selDay = dayIndex;
    switchView("roteiro");
    setTimeout(()=>{
      const node = document.querySelector(`[data-stop-key="${key(TRIP[dayIndex],stopIndex)}"]`);
      if(node) node.scrollIntoView({behavior:"smooth",block:"center"});
    },80);
    return;
  }

  const walletFilter = event.target.closest("[data-pro-wallet-filter]");
  if(walletFilter){
    PRO_UI.walletFilter = walletFilter.dataset.proWalletFilter;
    PRO_renderWallet();
    return;
  }

  const walletStatus = event.target.closest("[data-pro-wallet-status]");
  if(walletStatus){
    const [id,status] = walletStatus.dataset.proWalletStatus.split("|");
    STATE.walletStatus[id] = status;
    saveState();
    PRO_renderWallet();
    toast("Status atualizado");
    return;
  }

  const walletNote = event.target.closest("[data-pro-wallet-note]");
  if(walletNote){
    const id = walletNote.dataset.proWalletNote;
    PRO_simplePrompt("Nota da reserva","Sua nota",STATE.walletNotes[id]||"",value=>{
      if(value) STATE.walletNotes[id] = value;
      else delete STATE.walletNotes[id];
      saveState();
      if(curView==="carteira") PRO_renderWallet();
    });
    return;
  }

  const addExpense = event.target.closest("[data-pro-add-expense]");
  if(addExpense){
    PRO_openModal(PRO_expenseModal(null));
    return;
  }

  const editExpense = event.target.closest("[data-pro-edit-expense]");
  if(editExpense){
    const expense = STATE.expenses.find(item=>item.id===editExpense.dataset.proEditExpense);
    if(expense){
      PRO_UI.editingExpense = expense.id;
      PRO_openModal(PRO_expenseModal(expense));
    }
    return;
  }

  const expenseFilter = event.target.closest("[data-pro-expense-filter]");
  if(expenseFilter){
    PRO_UI.expenseFilter = expenseFilter.dataset.proExpenseFilter;
    PRO_renderExpenses();
    return;
  }

  const deleteExpense = event.target.closest("[data-pro-delete-expense]");
  if(deleteExpense){
    const form = document.getElementById("proExpenseForm");
    const id = form?.dataset.id;
    if(id && confirm("Excluir este gasto?")){
      STATE.expenses = STATE.expenses.filter(item=>item.id!==id);
      saveState();
      PRO_closeModal();
      PRO_renderExpenses();
      toast("Gasto excluído");
    }
    return;
  }

  const closeModal = event.target.closest("[data-pro-close-modal]");
  if(closeModal){
    PRO_closeModal();
    return;
  }

  if(event.target.id === "proModalBackdrop"){
    PRO_closeModal();
    return;
  }

  const check = event.target.closest("[data-pro-check]");
  if(check){
    const id = check.dataset.proCheck;
    if(STATE.checklist[id]) delete STATE.checklist[id];
    else STATE.checklist[id] = 1;
    saveState();
    PRO_renderChecklist();
    return;
  }

  const toggleGroup = event.target.closest("[data-pro-toggle-check-group]");
  if(toggleGroup){
    const id = toggleGroup.dataset.proToggleCheckGroup;
    PRO_UI.openChecklist[id] = !(PRO_UI.openChecklist[id] !== false);
    PRO_renderChecklist();
    return;
  }

  const removeCheck = event.target.closest("[data-pro-remove-check]");
  if(removeCheck){
    const id = removeCheck.dataset.proRemoveCheck;
    STATE.customChecks = STATE.customChecks.filter(item=>item.id!==id);
    delete STATE.checklist[id];
    saveState();
    PRO_renderChecklist();
    return;
  }

  const addCheck = event.target.closest("[data-pro-add-check]");
  if(addCheck){
    PRO_simplePrompt("Novo item","O que precisa lembrar?","",value=>{
      const text = String(value||"").trim();
      if(!text) return;
      STATE.customChecks.push({
        id:"custom-"+Date.now()+"-"+Math.random().toString(16).slice(2,7),
        groupId:"custom",
        text,
        note:"Item personalizado"
      });
      saveState();
      if(curView==="checklist") PRO_renderChecklist();
    });
    return;
  }

  const resetCheck = event.target.closest("[data-pro-reset-check]");
  if(resetCheck){
    if(confirm("Desmarcar todos os itens do checklist?")){
      STATE.checklist = {};
      saveState();
      PRO_renderChecklist();
      toast("Checklist resetado");
    }
    return;
  }

  const copyPhrase = event.target.closest("[data-pro-copy-phrase]");
  if(copyPhrase){
    const phrase = PRO_PHRASES[Number(copyPhrase.dataset.proCopyPhrase)];
    if(phrase) copyAddr(phrase.it);
    return;
  }

  const wake = event.target.closest("[data-pro-wake-toggle]");
  if(wake){
    await PRO_toggleWake();
    return;
  }

  const fullscreen = event.target.closest("[data-pro-fullscreen]");
  if(fullscreen){
    await PRO_toggleFullscreen();
    return;
  }

  const print = event.target.closest("[data-pro-print]");
  if(print){
    window.print();
    return;
  }

  const editNames = event.target.closest("[data-pro-edit-names]");
  if(editNames){
    PRO_namesModal();
    return;
  }

  const budgetCaps = event.target.closest("[data-pro-budget-caps]");
  if(budgetCaps){
    PRO_budgetModal();
    return;
  }

  const autoThemeBtn = event.target.closest("[data-pro-theme-auto]");
  if(autoThemeBtn){
    manualTheme = null;
    applyTheme();
    toast("Tema automático ativado");
    return;
  }

  if(event.target.closest("#proExportBackup")){
    exportBackup();
    return;
  }

  if(event.target.closest("#proImportBackup")){
    document.getElementById("proImportFile")?.click();
    return;
  }

  const resetAll = event.target.closest("[data-pro-reset-all]");
  if(resetAll){
    if(confirm("Apagar todos os dados locais deste roteiro? Esta ação não pode ser desfeita sem um backup.")){
      STATE = {done:{},budget:{},notes:{}};
      PRO_ensureState();
      saveState();
      refresh();
      toast("Dados locais resetados");
    }
  }
});

document.addEventListener("input",event=>{
  if(event.target.id === "proItinerarySearch"){
    PRO_UI.itineraryQuery = event.target.value;
    const position = event.target.selectionStart;
    renderRoteiro();
    const next = document.getElementById("proItinerarySearch");
    if(next){
      next.focus({preventScroll:true});
      try{ next.setSelectionRange(position,position); }catch(error){}
    }
    return;
  }

  if(event.target.matches("[data-pro-split-range]")){
    const label = document.querySelector("[data-pro-split-label]");
    if(label){
      const value = Number(event.target.value);
      label.parentElement.innerHTML = `<strong data-pro-split-label>${value}%</strong> ${PRO_escape(STATE.settings.names.me)} · ${100-value}% ${PRO_escape(STATE.settings.names.companion)}`;
    }
  }
});

document.addEventListener("submit",event=>{
  if(event.target.id === "proExpenseForm"){
    event.preventDefault();
    const form = event.target;
    const data = Object.fromEntries(new FormData(form).entries());
    const id = form.dataset.id || "exp-"+Date.now()+"-"+Math.random().toString(16).slice(2,7);
    const expense = {
      id,
      title:String(data.title||"").trim(),
      amount:Number(data.amount)||0,
      category:data.category||"extra",
      payer:data.payer==="companion"?"companion":"me",
      splitMe:Number(data.splitMe??50),
      date:data.date||PRO_todayIso(),
      note:String(data.note||"").trim(),
      created:Date.now()
    };
    const existing = STATE.expenses.findIndex(item=>item.id===id);
    if(existing >= 0){
      expense.created = STATE.expenses[existing].created || expense.created;
      STATE.expenses.splice(existing,1,expense);
    }else{
      STATE.expenses.push(expense);
    }
    saveState();
    PRO_closeModal();
    PRO_renderExpenses();
    toast("Gasto salvo");
    return;
  }

  if(event.target.id === "proNamesForm"){
    event.preventDefault();
    const data = Object.fromEntries(new FormData(event.target).entries());
    STATE.settings.names.me = String(data.me||"Você").trim() || "Você";
    STATE.settings.names.companion = String(data.companion||"Companhia").trim() || "Companhia";
    saveState();
    PRO_closeModal();
    if(curView==="mais") PRO_renderMore();
    toast("Nomes atualizados");
    return;
  }

  if(event.target.id === "proBudgetForm"){
    event.preventDefault();
    const data = Object.fromEntries(new FormData(event.target).entries());
    PRO_EXPENSE_CATEGORIES.forEach(cat=>{
      STATE.settings.budgetCaps[cat.id] = Number(data[cat.id]) || 0;
    });
    saveState();
    PRO_closeModal();
    if(curView==="gastos") PRO_renderExpenses();
    toast("Limites atualizados");
  }
});

document.addEventListener("change",event=>{
  if(event.target.id !== "proImportFile" || !event.target.files?.[0]) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      STATE = Object.assign({done:{},budget:{},notes:{}},parsed);
      PRO_ensureState();
      saveState();
      refresh();
      toast("Backup importado");
    }catch(error){
      alert("Arquivo de backup inválido.");
    }
  };
  reader.readAsText(event.target.files[0]);
});

document.addEventListener("keydown",event=>{
  if(event.key === "Escape") PRO_closeModal();
  if((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "k"){
    event.preventDefault();
    selDay = todayIndex();
    switchView("roteiro");
    setTimeout(()=>document.getElementById("proItinerarySearch")?.focus(),60);
  }
});

document.addEventListener("visibilitychange",async()=>{
  if(document.visibilityState === "visible" && PRO_UI.wakeLock === null && STATE?.settings?.wakeRequested){
    try{ PRO_UI.wakeLock = await navigator.wakeLock.request("screen"); }catch(error){}
  }
});

window.addEventListener("online",()=>toast("Conexão restaurada"));
window.addEventListener("offline",()=>toast("Sem internet · dados locais continuam disponíveis"));

function APP3_ensureState(){
  PRO_ensureState();
  if(!STATE.app3) STATE.app3 = {};
  if(!STATE.app3.stopNotes) STATE.app3.stopNotes = {};
  if(!STATE.app3.documents) STATE.app3.documents = {};
  if(!STATE.app3.documentNotes) STATE.app3.documentNotes = {};
  if(!STATE.app3.diary) STATE.app3.diary = {};
  if(!STATE.app3.ratings) STATE.app3.ratings = {};
  if(!STATE.app3.highlights) STATE.app3.highlights = {};
  if(!STATE.app3.weatherNotes) STATE.app3.weatherNotes = {};
  if(!STATE.app3.focusMode) STATE.app3.focusMode = false;
  if(!STATE.app3.lastSecondary) STATE.app3.lastSecondary = "mais";
  if(STATE.app3.haptics === undefined) STATE.app3.haptics = true;
  document.body.classList.toggle("app3-focus-mode", !!STATE.app3.focusMode);
}

function APP3_haptic(pattern=12){
  APP3_ensureState();
  if(!STATE.app3.haptics) return;
  if("vibrate" in navigator){
    try{ navigator.vibrate(pattern); }catch(error){}
  }
}

function APP3_stopKey(day,index){
  return `${day.date}#${index}`;
}

function APP3_stopNote(day,index){
  APP3_ensureState();
  return STATE.app3.stopNotes[APP3_stopKey(day,index)] || "";
}

function APP3_setStopNote(day,index,value){
  APP3_ensureState();
  const k = APP3_stopKey(day,index);
  const clean = String(value || "").trim();
  if(clean) STATE.app3.stopNotes[k] = clean;
  else delete STATE.app3.stopNotes[k];
  saveState();
}

function APP3_upgradeShell(){
  const topRow = document.querySelector(".top-row");
  if(!topRow || topRow.dataset.app3Upgraded) return;
  topRow.dataset.app3Upgraded = "1";

  const brand = topRow.querySelector(".brand");
  const theme = document.getElementById("themeBtn");

  if(brand){
    const wrap = document.createElement("div");
    wrap.className = "app3-top-meta";
    brand.parentNode.insertBefore(wrap, brand);
    wrap.appendChild(brand);

    const city = document.createElement("span");
    city.className = "app3-top-city";
    city.id = "app3TopCity";
    city.textContent = "Trip OS";
    wrap.appendChild(city);
  }

  const actions = document.createElement("div");
  actions.className = "app3-top-actions";

  const focus = document.createElement("button");
  focus.className = "app3-header-btn";
  focus.type = "button";
  focus.dataset.app3Focus = "1";
  focus.title = "Modo foco";
  focus.setAttribute("aria-label","Alternar modo foco");
  focus.innerHTML = APP3_ICONS.focus;
  actions.appendChild(focus);

  if(theme){
    theme.parentNode.insertBefore(actions, theme);
    actions.appendChild(theme);
  }else{
    topRow.appendChild(actions);
  }
}

function APP3_dayStats(day){
  const total = day.stops.length;
  const done = day.stops.filter((_,i)=>isDone(day,i)).length;
  const skipped = day.stops.filter((_,i)=>PRO_isSkipped(day,i)).length;
  const resolved = done + skipped;
  return {
    total,
    done,
    skipped,
    resolved,
    percent: total ? Math.round(resolved / total * 100) : 0
  };
}

function APP3_tripRangeLabel(){
  return "09–15 ago 2026";
}

function APP3_countByCity(city){
  return TRIP.reduce((sum,day)=>{
    if(day.city !== city) return sum;
    return sum + day.stops.length;
  },0);
}

function APP3_markerMarkup(day,stop){
  const delay = PRO_dayDelay(day);
  const shown = PRO_adjustTime(day,stop.t);
  const shownEnd = stop.end ? PRO_adjustTime(day,stop.end) : "";
  return `
    <div class="mk-time ${delay ? "app3-time-shifted" : ""}">${shown}</div>
    ${delay ? `<span class="app3-time-original">orig. ${stop.t}</span>` : ""}
    ${shownEnd ? `<div class="mk-dur">até ${shownEnd}</div>` : ""}`;
}

  return `
    <div class="stop ${done?"is-done":""} ${skipped?"is-skipped":""}" data-state="${state}" data-stop-key="${key(day,index)}">

      <article class="card">

          ${stop.nomap
            ? ""
            : `<a class="btn maps" href="${mapsURL(day,stop)}" target="_blank" rel="noopener">${NAVICON.mapa} Maps</a>`}

function APP3_transportLegs(){
  const legs = [];
  TRIP.forEach((day,dayIndex)=>{
    day.stops.forEach((stop,stopIndex)=>{
      if(!["voo","transporte"].includes(stop.cat)) return;
      if(!/(→|\bpara\b|\bRoma\b|\bNapoli\b|\bNápoles\b|\bFCO\b|\bBOD\b)/i.test(stop.n)) return;
      legs.push({day,dayIndex,stop,stopIndex});
    });
  });
  return legs;
}

function APP3_parseRouteTitle(title){
  const arrow = String(title).split("→");
  if(arrow.length >= 2){
    return {
      from: arrow[0].replace(/^(Voo|FlixBus|Trem|Metro A|Táxi|Leonardo Express)\s*/i,"").trim(),
      to: arrow.slice(1).join("→").trim()
    };
  }
  return {from:title,to:"Destino"};
}

function APP3_expenseChart(stats){
  const ordered = [...PRO_EXPENSE_CATEGORIES]
    .map(cat=>({cat,value:stats.byCategory[cat.id]||0}))
    .sort((a,b)=>b.value-a.value);
  const top = ordered.slice(0,4);
  const total = stats.total || 0;
  let cursor = 0;
  const stops = top.map(item=>{
    cursor += total ? (item.value/total*100) : 0;
    return cursor;
  });
  while(stops.length<4) stops.push(cursor);
  return `
    <div class="app3-money-chart">
      <div class="app3-donut" style="--app3-p1:${stops[0]}%;--app3-p2:${stops[1]}%;--app3-p3:${stops[2]}%">
        <div class="app3-donut-label"><span><b>${PRO_money(total)}</b><small>total</small></span></div>
      </div>
      <div class="app3-chart-list">
        ${top.map(item=>`
          <div class="app3-chart-row">
            <span class="app3-chart-dot"></span>

function APP3_exportExpensesCSV(){
  PRO_ensureState();
  const rows = [
    ["Data","Descrição","Categoria","Valor EUR","Pagador","Sua parte %","Nota"],
    ...STATE.expenses.map(item=>[
      item.date||"",
      item.title||"",
      item.category||"",
      Number(item.amount||0).toFixed(2),
      item.payer||"",
      Number(item.splitMe??50),
      item.note||""
    ])
  ];
  const escapeCell = value => `"${String(value).replace(/"/g,'""')}"`;
  const csv = rows.map(row=>row.map(escapeCell).join(";")).join("\n");
  const blob = new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "italia-2026-gastos.csv";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),800);
  toast("CSV exportado");
}

function switchView(v){
  if(curView === "documentos") APP3_saveDocumentNotes();
  if(curView === "diario") APP3_saveDiary();
  curView = v;
  document.querySelectorAll(".view").forEach(section=>section.classList.toggle("active",section.id === "view-"+v));
  document.querySelectorAll("nav button").forEach(button=>button.setAttribute("aria-selected",button.dataset.view === v));
  APP3_ensureState();
  if(["explorar","documentos","transporte","diario","seguranca","mapa","orcamento"].includes(v)) STATE.app3.lastSecondary = v;
  saveState();
  refresh();
  APP3_updateShell();
  window.scrollTo({top:0,behavior:"smooth"});
}

function refresh(){
  APP3_ensureState();
  if(curView === "hoje") renderHoje();
  if(curView === "roteiro") renderRoteiro();
  if(curView === "carteira") PRO_renderWallet();
  if(curView === "gastos") PRO_renderExpenses();
  if(curView === "checklist") PRO_renderChecklist();
  if(curView === "mais") PRO_renderMore();
  if(curView === "orcamento") renderOrcamento();
  if(curView === "mapa") renderMapa();
  if(curView === "explorar") APP3_renderExplore();
  if(curView === "documentos") APP3_renderDocuments();
  if(curView === "transporte") APP3_renderTransport();
  if(curView === "diario") APP3_renderDiary();
  if(curView === "seguranca") APP3_renderSafety();
  renderCountdown();
  APP3_updateShell();
}

document.addEventListener("click",event=>{
  const dayButton = event.target.closest("[data-app3-open-day]");
  if(dayButton){
    selDay = Number(dayButton.dataset.app3OpenDay) || 0;
    switchView("roteiro");
    APP3_haptic(8);
    return;
  }

  const detail = event.target.closest("[data-app3-stop-detail]");
  if(detail){
    const [dayIndex,stopIndex] = detail.dataset.app3StopDetail.split("|").map(Number);
    APP3_openStopSheet(dayIndex,stopIndex);
    return;
  }

  const closeSheet = event.target.closest("[data-app3-close-sheet]");
  if(closeSheet){
    if(event.target.closest("[data-app3-sheet]") && !event.target.closest(".app3-sheet-close")) return;
    APP3_closeSheet();
    return;
  }

  const copyDetail = event.target.closest("[data-app3-copy-detail]");
  if(copyDetail){
    const [dayIndex,stopIndex] = copyDetail.dataset.app3CopyDetail.split("|").map(Number);
    const day = TRIP[dayIndex];
    const stop = day?.stops?.[stopIndex];
    if(day && stop){
      const text = [
        `${day.wd} · ${fmtDate(day.date)} · ${PRO_adjustTime(day,stop.t)}`,
        stop.n,
        stop.loc||"",
        stop.note||"",
        APP3_stopNote(day,stopIndex)||""
      ].filter(Boolean).join("\n");
      copyAddr(text);
      APP3_haptic(10);
    }
    return;
  }

  const food = event.target.closest("[data-app3-food-map]");
  if(food){
    const q = food.dataset.app3FoodMap;
    window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`,"_blank","noopener");
    return;
  }

  const docToggle = event.target.closest("[data-app3-doc-toggle]");
  if(docToggle){
    APP3_ensureState();
    APP3_saveDocumentNotes();
    const id = docToggle.dataset.app3DocToggle;
    if(STATE.app3.documents[id]) delete STATE.app3.documents[id];
    else STATE.app3.documents[id] = 1;
    saveState();
    APP3_renderDocuments();
    APP3_haptic(10);
    return;
  }

  if(event.target.closest("[data-app3-doc-reset]")){
    if(confirm("Resetar o checklist de documentos? As notas desta área serão mantidas.")){
      STATE.app3.documents = {};
      saveState();
      APP3_renderDocuments();
      toast("Documentos resetados");
    }
    return;
  }

  if(event.target.closest("[data-app3-copy-all-transport]")){
    copyAddr(APP3_transportText());
    return;
  }

  const rate = event.target.closest("[data-app3-rate]");
  if(rate){
    APP3_saveDiary();
    const [date,value] = rate.dataset.app3Rate.split("|");
    STATE.app3.ratings[date] = Number(value) || 0;
    saveState();
    APP3_renderDiary();
    APP3_haptic(8);
    return;
  }

  if(event.target.closest("[data-app3-save-diary]")){
    APP3_saveDiary();
    toast("Diário salvo");
    APP3_haptic(10);
    return;
  }

  if(event.target.closest("[data-app3-copy-diary]")){
    copyAddr(APP3_diaryText());
    return;
  }

  const quickExpense = event.target.closest("[data-app3-quick-expense]");
  if(quickExpense){
    const preset = APP3_QUICK_EXPENSES.find(item=>item.id===quickExpense.dataset.app3QuickExpense);
    if(preset){
      const base = {
        id:"",
        title:preset.label,
        amount:"",
        category:preset.category,
        payer:"me",
        splitMe:50,
        date:PRO_todayIso(),
        note:""
      };
      PRO_openModal(PRO_expenseModal(base));
      setTimeout(()=>document.querySelector('#proExpenseForm input[name="amount"]')?.focus(),50);
    }
    return;
  }

  if(event.target.closest("[data-app3-export-csv]")){
    APP3_exportExpensesCSV();
    return;
  }

  const focus = event.target.closest("[data-app3-focus]");
  if(focus){
    APP3_ensureState();
    STATE.app3.focusMode = !STATE.app3.focusMode;
    saveState();
    document.body.classList.toggle("app3-focus-mode",STATE.app3.focusMode);
    if(curView === "mais") PRO_renderMore();
    APP3_haptic(8);
    return;
  }

  const headerFocus = event.target.closest("[data-app3-focus='1']");
  if(headerFocus){
    APP3_ensureState();
    STATE.app3.focusMode = !STATE.app3.focusMode;
    saveState();
    document.body.classList.toggle("app3-focus-mode",STATE.app3.focusMode);
    APP3_haptic(8);
    return;
  }

  const haptics = event.target.closest("[data-app3-haptics]");
  if(haptics){
    APP3_ensureState();
    STATE.app3.haptics = !STATE.app3.haptics;
    saveState();
    if(STATE.app3.haptics) APP3_haptic([8,35,8]);
    if(curView === "mais") PRO_renderMore();
    return;
  }
});

    const id = event.target.dataset.app3DocNote;
    APP3_ensureState();
    STATE.app3.documentNotes[id] = event.target.value;

    const date = event.target.dataset.app3Diary;
    APP3_ensureState();
    STATE.app3.diary[date] = event.target.value;
    saveState();
  }

  if(event.target.matches("[data-app3-highlight]")){
    const [date,keyName] = event.target.dataset.app3Highlight.split("|");
    APP3_ensureState();
    if(!STATE.app3.highlights[date]) STATE.app3.highlights[date] = {};
    STATE.app3.highlights[date][keyName] = event.target.value;

});

/* The original delegated handlers update progress; close sheets after those actions. */
document.addEventListener("click",event=>{
  if(event.target.closest("#app3SheetHost [data-done], #app3SheetHost [data-pro-favorite], #app3SheetHost [data-pro-skip]")){
    setTimeout(()=>{
      const host = document.getElementById("app3SheetHost");
      if(host) APP3_closeSheet();
    },40);
  }
},true);

/* Keyboard ergonomics. */
document.addEventListener("keydown",event=>{
  if(event.key === "Escape" && document.getElementById("app3SheetHost")){
    APP3_closeSheet();
    return;
  }
  if((event.ctrlKey || event.metaKey) && event.shiftKey && event.key.toLowerCase() === "f"){
    event.preventDefault();
    APP3_ensureState();
    STATE.app3.focusMode = !STATE.app3.focusMode;
    saveState();
    document.body.classList.toggle("app3-focus-mode",STATE.app3.focusMode);
  }
});
