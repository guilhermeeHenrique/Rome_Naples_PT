<title>Italia Trip OS · Roma · Nápoles · Pompeia — 09 a 15 ago 2026</title>
<style>
/* ============================================================
   PALETA — fresco pompeiano: vermelho de Pompeia, amarelo de
   Nápoles, basalto vulcânico, travertino, bronze oxidado.
   ============================================================ */
:root{
  --basalt:#14120F;
  --slate:#1F1C18;
  --slate-2:#2A2621;
  --line:#39332B;
  --travertine:#EFE8DA;
  --muted:#A79C8B;
  --pompeii:#A32E22;
  --pompeii-lo:#7B221A;
  --naples:#E3B23C;
  --verdigris:#5C8A7B;

  --bg:var(--basalt);
  --surface:var(--slate);
  --surface-2:var(--slate-2);
  --ink:var(--travertine);
  --ink-dim:var(--muted);
  --rule:var(--line);

  --display:Georgia,"Iowan Old Style","Times New Roman",serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --data:ui-monospace,"SF Mono",Menlo,Consolas,monospace;

  --nav-h:64px;
}
html[data-theme="light"]{
  --bg:#F2EDE3;
  --surface:#FFFDF8;
  --surface-2:#EAE3D5;
  --ink:#221E19;
  --ink-dim:#6B6153;
  --rule:#D8CFBD;
  --pompeii:#96271C;
  --verdigris:#3F6B5C;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overscroll-behavior-y:contain}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--body);font-size:16px;line-height:1.5;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
  min-height:100dvh;
}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit}

/* ---------- CABEÇALHO ---------- */
.top{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,var(--bg) 72%,transparent);
  padding:14px 18px 10px;
  border-bottom:1px solid var(--rule);
}
.top-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-size:19px;line-height:1.15;letter-spacing:.02em}
.brand span{display:block;font-family:var(--data);font-size:10px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--ink-dim);margin-bottom:3px}
.icon-btn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  border:1px solid var(--rule);background:var(--surface);font-size:16px;flex:none}
.icon-btn:active{transform:scale(.94)}

/* Contagem regressiva */
.countdown{
  margin-top:10px;display:flex;align-items:center;gap:11px;
  background:var(--surface);border:1px solid var(--rule);
  border-left:3px solid var(--naples);
  border-radius:12px;padding:9px 13px;
}
.countdown .cd-time{font-family:var(--data);font-size:19px;font-weight:600;
  letter-spacing:.02em;color:var(--naples);font-variant-numeric:tabular-nums}
.countdown .cd-txt{font-size:12.5px;line-height:1.3;color:var(--ink-dim);min-width:0}
.countdown .cd-txt b{display:block;color:var(--ink);font-weight:600;font-size:13.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.countdown.is-late{border-left-color:var(--pompeii)}
.countdown.is-late .cd-time{color:var(--pompeii)}

/* ---------- ABAS ---------- */
.view{display:none;padding:18px 18px 30px;animation:in .22s ease}
.view.active{display:block}
@keyframes in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

/* ---------- SELETOR DE DIAS ---------- */
.daybar{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 14px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.daybar::-webkit-scrollbar{display:none}
.daychip{flex:none;border:1px solid var(--rule);background:var(--surface);
  border-radius:12px;padding:8px 12px;text-align:left;min-width:78px}
.daychip .dc-wd{font-family:var(--data);font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-dim)}
.daychip .dc-d{font-family:var(--display);font-size:17px;line-height:1.1;margin-top:2px}
.daychip .dc-city{font-size:11px;color:var(--ink-dim);margin-top:1px}
.daychip[aria-selected="true"]{background:var(--pompeii);border-color:var(--pompeii);color:#FFF6EC}
.daychip[aria-selected="true"] .dc-wd,.daychip[aria-selected="true"] .dc-city{color:#F3D7CB}
.daychip.is-today::after{content:"";display:block;width:5px;height:5px;border-radius:50%;
  background:var(--naples);margin-top:5px}

/* ---------- CABEÇALHO DO DIA ---------- */
.dayhead{margin-bottom:16px}
.dayhead h2{font-family:var(--display);font-size:25px;margin:0;line-height:1.15;letter-spacing:.01em}
.dayhead .dh-meta{font-family:var(--data);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-dim);margin-bottom:5px}
.progress{margin-top:12px}
.progress .bar{height:5px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--verdigris);
  border-radius:99px;transition:width .35s ease}
.progress .lbl{display:flex;justify-content:space-between;font-family:var(--data);
  font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim);margin-top:6px}

/* ---------- TRILHA / TIMELINE (elemento-assinatura) ---------- */
.rail{position:relative;padding-left:56px}
.rail::before{content:"";position:absolute;left:23px;top:8px;bottom:8px;width:1px;
  background:linear-gradient(180deg,transparent,var(--rule) 8%,var(--rule) 92%,transparent)}

.stop{position:relative;margin-bottom:14px}
.stop .marker{position:absolute;left:-56px;top:2px;width:47px;text-align:right}
.stop .mk-time{font-family:var(--data);font-size:13px;font-weight:600;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stop .mk-dur{font-family:var(--data);font-size:9.5px;color:var(--ink-dim);margin-top:1px}
.stop .dot{position:absolute;left:-38px;top:6px;width:11px;height:11px;border-radius:50%;
  background:var(--bg);border:2px solid var(--rule);z-index:2}

.card{background:var(--surface);border:1px solid var(--rule);border-radius:14px;
  padding:13px 14px;transition:opacity .25s,background .25s}
.card h3{margin:0;font-family:var(--display);font-size:17.5px;line-height:1.25;
  font-weight:600;letter-spacing:.005em}
.card .cat{font-family:var(--data);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-dim);display:flex;align-items:center;gap:6px;margin-bottom:4px}
.card .loc{font-size:13px;color:var(--ink-dim);margin-top:5px;line-height:1.4}
.card .note{font-size:13px;margin-top:8px;padding-left:10px;
  border-left:2px solid var(--rule);color:var(--ink-dim);line-height:1.45}
.card .note.tip{border-left-color:var(--naples);color:var(--ink)}
.card .actions{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}

.btn{border:1px solid var(--rule);background:var(--surface-2);border-radius:10px;
  padding:9px 13px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;
  gap:6px;min-height:40px;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn.maps{border-color:transparent;background:var(--pompeii);color:#FFF6EC}
.btn.done{flex:1;justify-content:center}
.btn.done[aria-pressed="true"]{background:var(--verdigris);border-color:transparent;color:#0E1614}
.btn.icon-only{padding:0;width:40px;min-width:40px;justify-content:center;flex:none;background:var(--surface-2)}

/* Estados temporais */
.stop[data-state="past"] .dot{background:var(--rule);border-color:var(--rule)}
.stop[data-state="past"] .mk-time{color:var(--ink-dim);font-weight:500}
.stop[data-state="now"] .dot{background:var(--naples);border-color:var(--naples);
  box-shadow:0 0 0 5px color-mix(in srgb,var(--naples) 22%,transparent)}
.stop[data-state="now"] .card{border-color:var(--naples)}
.stop[data-state="now"] .mk-time{color:var(--naples)}
.stop[data-state="next"] .dot{border-color:var(--naples)}
.stop[data-state="next"] .card{border-color:color-mix(in srgb,var(--naples) 45%,var(--rule))}
.stop[data-state="late"] .dot{background:var(--pompeii);border-color:var(--pompeii)}
.stop[data-state="late"] .card{border-color:var(--pompeii)}
.stop[data-state="late"] .mk-time{color:var(--pompeii)}

.badge{font-family:var(--data);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  padding:3px 7px;border-radius:99px;margin-left:auto;font-weight:600}
.badge.now{background:var(--naples);color:#1A1405}
.badge.next{background:transparent;border:1px solid var(--naples);color:var(--naples)}
.badge.late{background:var(--pompeii);color:#FFF0EA}

/* Concluído — ofuscado mas legível e clicável */
.stop.is-done .card{opacity:.42;background:var(--surface-2)}
.stop.is-done .card h3{text-decoration:line-through;text-decoration-thickness:1.5px}
.stop.is-done .dot{background:var(--verdigris);border-color:var(--verdigris);box-shadow:none}
.stop.is-done .badge{display:none}
.stop.is-done .card:focus-within,.stop.is-done .card:hover{opacity:.8}

/* Etiqueta de sugestão a confirmar */
.sugg{display:inline-block;font-family:var(--data);font-size:9px;letter-spacing:.13em;
  text-transform:uppercase;border:1px dashed var(--naples);color:var(--naples);
  border-radius:99px;padding:2px 7px;margin-left:7px;vertical-align:2px}

/* Bloco de deslocamento entre paradas */
.leg{font-family:var(--data);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-dim);margin:-6px 0 12px;padding-left:2px;display:flex;align-items:center;gap:7px}
.leg::before{content:"";width:14px;height:1px;background:var(--rule)}

/* ---------- ANOTAÇÕES ---------- */
.notes{margin-top:22px}
.notes label{font-family:var(--data);font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-dim);display:block;margin-bottom:7px}
textarea{width:100%;min-height:96px;background:var(--surface);border:1px solid var(--rule);
  border-radius:12px;padding:12px;resize:vertical;font-size:14.5px;line-height:1.5}
textarea:focus,input:focus{outline:2px solid var(--naples);outline-offset:1px}

/* ---------- ORÇAMENTO ---------- */
.total{background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--pompeii);
  border-radius:14px;padding:15px;margin-bottom:18px}
.total .t-lbl{font-family:var(--data);font-size:10px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink-dim)}
.total .t-grid{display:flex;gap:26px;margin-top:9px}
.total .t-val{font-family:var(--display);font-size:27px;line-height:1;font-variant-numeric:tabular-nums}
.total .t-val small{font-size:13px;color:var(--ink-dim);font-family:var(--data);
  display:block;letter-spacing:.12em;text-transform:uppercase;margin-top:5px}
.t-diff{font-family:var(--data);font-size:12px;margin-top:11px;padding-top:11px;
  border-top:1px solid var(--rule);color:var(--ink-dim)}

.bday{background:var(--surface);border:1px solid var(--rule);border-radius:14px;
  padding:13px 14px;margin-bottom:11px}
.bday h4{margin:0 0 10px;font-family:var(--display);font-size:16px;display:flex;
  justify-content:space-between;align-items:baseline;gap:10px}
.bday h4 em{font-family:var(--data);font-size:11px;font-style:normal;color:var(--ink-dim);
  letter-spacing:.1em}
.brow{display:grid;grid-template-columns:1fr 78px 78px;gap:8px;align-items:center;margin-bottom:7px}
.brow .bk{font-size:12.5px;color:var(--ink-dim)}
.brow input{width:100%;background:var(--surface-2);border:1px solid var(--rule);
  border-radius:9px;padding:8px 9px;font-family:var(--data);font-size:13px;
  text-align:right;font-variant-numeric:tabular-nums;min-height:38px}
.bhead{display:grid;grid-template-columns:1fr 78px 78px;gap:8px;font-family:var(--data);
  font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-dim);
  margin-bottom:7px;text-align:right}
.bhead span:first-child{text-align:left}

/* ---------- MAPA GERAL ---------- */
.mapgroup{margin-bottom:24px}
.mapgroup h4{font-family:var(--display);font-size:19px;margin:0 0 3px}
.mapgroup .mg-sub{font-family:var(--data);font-size:10px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--ink-dim);margin-bottom:11px}
.mlink{display:flex;align-items:center;gap:11px;padding:11px 13px;background:var(--surface);
  border:1px solid var(--rule);border-radius:11px;margin-bottom:7px;text-decoration:none;
  min-height:46px}
.mlink .ml-n{flex:1;font-size:14px;line-height:1.3;min-width:0}
.mlink .ml-n small{display:block;color:var(--ink-dim);font-size:11.5px;margin-top:1px}
.mlink .ml-go{font-family:var(--data);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--pompeii);font-weight:700;flex:none}
.mlink.is-done{opacity:.4}
.mlink.is-done .ml-n{text-decoration:line-through}

/* ---------- NAVEGAÇÃO INFERIOR ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;
  grid-template-columns:repeat(4,1fr);
  background:color-mix(in srgb,var(--bg) 94%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--rule);
  padding-bottom:env(safe-area-inset-bottom)}
nav button{height:var(--nav-h);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;color:var(--ink-dim);font-family:var(--data);
  font-size:9.5px;letter-spacing:.11em;text-transform:uppercase}
nav button i{font-style:normal;line-height:1;display:flex}
nav button i svg{width:20px;height:20px}
nav button[aria-selected="true"]{color:var(--pompeii)}
html[data-theme="dark"] nav button[aria-selected="true"]{color:var(--naples)}

/* ---------- RODAPÉ DE DADOS ---------- */
.datafoot{margin-top:26px;padding-top:16px;border-top:1px solid var(--rule);
  display:flex;gap:9px;flex-wrap:wrap}
.datafoot .btn{font-size:12px;padding:8px 12px;min-height:36px}
.datafoot .hint{font-size:11.5px;color:var(--ink-dim);width:100%;margin-top:6px;line-height:1.45}

/* ---------- ÍCONES DE CATEGORIA (SVG, linha, cor herdada) ---------- */
.cat svg{width:12.5px;height:12.5px;vertical-align:-2.5px;flex:none}
.icon-btn svg{width:18px;height:18px}
.btn svg{width:15px;height:15px;flex:none}
.mlink > span:first-child svg{width:15px;height:15px}

/* ---------- HERO DO DIA (elemento-assinatura) ---------- */
.dayhero{position:relative;margin:-18px -18px 18px;padding:24px 18px 18px;
  background:linear-gradient(150deg,var(--surface) 45%,var(--surface-2));
  border-bottom:1px solid var(--rule);overflow:hidden}
.dayhero .hero-art{position:absolute;right:-8px;top:-8px;width:128px;height:128px;
  color:var(--rule);opacity:.6;pointer-events:none}
html[data-theme="light"] .dayhero .hero-art{opacity:.4}
.dayhero .dh-inner{position:relative;z-index:1;max-width:78%}
.dayhero .dh-tag{font-size:13px;color:var(--ink-dim);margin-top:7px;line-height:1.4}

.day-actions{display:flex;gap:8px;margin:-4px 0 18px}
.day-actions .btn{font-size:12px;padding:8px 12px;min-height:36px;flex:1;justify-content:center}

/* ---------- TRILHA DA VIAGEM (visão geral tocável) ---------- */
.triptrack{display:flex;gap:6px;margin-bottom:18px}
.tp-item{flex:1;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center}
.tp-bar{width:100%;height:30px;border-radius:8px;background:var(--surface-2);
  border:1px solid var(--rule);position:relative;overflow:hidden}
.tp-bar i{position:absolute;left:0;right:0;bottom:0;background:var(--verdigris);
  transition:height .3s ease}
.tp-item.is-today .tp-bar{border-color:var(--naples)}
.tp-lbl{font-family:var(--data);font-size:9px;letter-spacing:.05em;color:var(--ink-dim);
  margin-top:5px}
.tp-item.is-today .tp-lbl{color:var(--naples)}

/* ---------- AVISO / TOAST ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);
  font-size:12.5px;font-weight:600;padding:10px 18px;border-radius:99px;opacity:0;
  pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:60;
  white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(min-width:720px){
  body{max-width:760px;margin:0 auto}
  nav{max-width:760px;margin:0 auto}
  .rail{padding-left:64px}
  .rail::before{left:27px}
  .stop .marker{left:-64px;width:53px}
  .stop .dot{left:-42px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ========================================================================== */
/* ITALIA TRIP OS 2.0 — CAMADA PROFISSIONAL                                  */
/* ========================================================================== */
/* Esta camada amplia o aplicativo original sem dependências externas.        */
/* Mobile first, acessível, responsiva, compatível com arquivo local.          */
/* ========================================================================== */

:root {
  --pro-radius-xs: 8px;
  --pro-radius-sm: 12px;
  --pro-radius-md: 16px;
  --pro-radius-lg: 22px;
  --pro-radius-xl: 30px;
  --pro-shadow-sm: 0 8px 22px rgba(0, 0, 0, .10);
  --pro-shadow-md: 0 18px 48px rgba(0, 0, 0, .16);
  --pro-shadow-lg: 0 28px 80px rgba(0, 0, 0, .24);
  --pro-glass: color-mix(in srgb, var(--surface) 86%, transparent);
  --pro-positive: #64A88F;
  --pro-warning: #D9A93D;
  --pro-danger: #C35447;
  --pro-info: #6E96C8;
  --pro-purple: #8B78B8;
  --pro-pink: #B96B82;
  --pro-max: 920px;
  --pro-content-pad: 18px;
  --pro-bottom-safe: calc(var(--nav-h) + env(safe-area-inset-bottom) + 22px);
}

html {
  scroll-behavior: smooth;
  text-rendering: optimizeLegibility;
}

body {
  overflow-x: hidden;
}

body.pro-modal-open {
  overflow: hidden;
}

[hidden] {
  display: none !important;
}

button,
a,
input,
textarea,
select {
  touch-action: manipulation;
}

button:focus-visible,
a:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible {
  outline: 2px solid var(--naples);
  outline-offset: 3px;
}

.pro-sr-only {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  margin: -1px !important;
  overflow: hidden !important;
  clip: rect(0, 0, 0, 0) !important;
  white-space: nowrap !important;
  border: 0 !important;
}

.pro-hidden {
  display: none !important;
}

.pro-no-scrollbar {
  scrollbar-width: none;
}

.pro-no-scrollbar::-webkit-scrollbar {
  display: none;
}

/* -------------------------------------------------------------------------- */
/* TOPO TURBINADO                                                              */
/* -------------------------------------------------------------------------- */

.top {
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.top-row {
  align-items: center;
}

.pro-top-actions {
  display: flex;
  align-items: center;
  gap: 7px;
}

.pro-status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--pro-positive);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--pro-positive) 18%, transparent);
}

.pro-status-dot.offline {
  background: var(--pro-warning);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--pro-warning) 18%, transparent);
}

.pro-mini-btn {
  min-width: 38px;
  height: 38px;
  border-radius: 11px;
  border: 1px solid var(--rule);
  background: var(--surface);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  color: var(--ink);
  padding: 0 10px;
  font-size: 12px;
  font-weight: 700;
}

.pro-mini-btn svg {
  width: 17px;
  height: 17px;
}

.pro-mini-btn.is-active {
  background: var(--naples);
  color: #17130A;
  border-color: var(--naples);
}

/* -------------------------------------------------------------------------- */
/* NAVEGAÇÃO PRINCIPAL COM 6 ÁREAS                                            */
/* -------------------------------------------------------------------------- */

nav {
  grid-template-columns: repeat(6, minmax(62px, 1fr));
  overflow-x: auto;
  overscroll-behavior-x: contain;
  scrollbar-width: none;
}

nav::-webkit-scrollbar {
  display: none;
}

nav button {
  min-width: 62px;
  padding: 0 4px;
}

nav button i {
  min-height: 21px;
}

nav button[aria-selected="true"] {
  font-weight: 700;
}

/* -------------------------------------------------------------------------- */
/* BASE DE SEÇÕES E CABEÇALHOS                                                */
/* -------------------------------------------------------------------------- */

.pro-page-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 17px;
}

.pro-page-head-copy {
  min-width: 0;
}

.pro-eyebrow {
  font-family: var(--data);
  font-size: 10px;
  letter-spacing: .17em;
  text-transform: uppercase;
  color: var(--ink-dim);
  margin-bottom: 5px;
}

.pro-page-title {
  margin: 0;
  font-family: var(--display);
  font-size: clamp(26px, 7vw, 36px);
  line-height: 1.05;
  letter-spacing: -.015em;
}

.pro-page-subtitle {
  margin: 7px 0 0;
  max-width: 620px;
  color: var(--ink-dim);
  font-size: 13.5px;
  line-height: 1.5;
}

.pro-section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin: 24px 0 10px;
}

.pro-section-title h3 {
  margin: 0;
  font-family: var(--display);
  font-size: 19px;
  line-height: 1.2;
}

.pro-section-title small {
  color: var(--ink-dim);
  font-family: var(--data);
  font-size: 10px;
  letter-spacing: .08em;
  text-transform: uppercase;
}

.pro-divider {
  height: 1px;
  background: var(--rule);
  margin: 22px 0;
}

/* -------------------------------------------------------------------------- */
/* CARDS DE KPI / DASHBOARD                                                   */
/* -------------------------------------------------------------------------- */

.pro-kpi-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 14px;
}

.pro-kpi {
  position: relative;
  min-height: 112px;
  padding: 14px;
  background: linear-gradient(145deg, var(--surface), var(--surface-2));
  border: 1px solid var(--rule);
  border-radius: var(--pro-radius-md);
  overflow: hidden;
}

.pro-kpi::after {
  content: "";
  position: absolute;
  right: -26px;
  bottom: -34px;
  width: 84px;
  height: 84px;
  border-radius: 50%;
  background: color-mix(in srgb, var(--naples) 10%, transparent);
}

.pro-kpi-label {
  position: relative;
  z-index: 1;
  color: var(--ink-dim);
  font-family: var(--data);
  font-size: 9.5px;
  letter-spacing: .13em;
  text-transform: uppercase;
}

.pro-kpi-value {
  position: relative;
  z-index: 1;
  margin-top: 7px;
  font-family: var(--display);
  font-size: 27px;
  line-height: 1;
}

.pro-kpi-value.pro-small {
  font-size: 20px;
}

.pro-kpi-foot {
  position: relative;
  z-index: 1;
  margin-top: 8px;
  color: var(--ink-dim);
  font-size: 11px;
}

.pro-kpi.accent {
  border-color: color-mix(in srgb, var(--naples) 55%, var(--rule));
}

.pro-kpi.danger {
  border-color: color-mix(in srgb, var(--pompeii) 60%, var(--rule));
}

.pro-kpi.positive {
  border-color: color-mix(in srgb, var(--pro-positive) 60%, var(--rule));
}

/* -------------------------------------------------------------------------- */
/* HERO DE STATUS / PRÓXIMA PARADA                                            */
/* -------------------------------------------------------------------------- */

.pro-now-card {
  position: relative;
  overflow: hidden;
  border-radius: var(--pro-radius-lg);
  border: 1px solid var(--rule);
  background:
    radial-gradient(circle at 88% 8%, color-mix(in srgb, var(--naples) 18%, transparent), transparent 34%),
    linear-gradient(145deg, var(--surface), var(--surface-2));
  padding: 18px;
  box-shadow: var(--pro-shadow-sm);
}

.pro-now-card.pro-alert {
  background:
    radial-gradient(circle at 88% 8%, color-mix(in srgb, var(--pompeii) 20%, transparent), transparent 34%),
    linear-gradient(145deg, var(--surface), var(--surface-2));
}

.pro-now-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.pro-now-label {
  font-family: var(--data);
  font-size: 10px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--naples);
}

.pro-now-time {
  font-family: var(--data);
  font-size: 12px;
  color: var(--ink-dim);
}

.pro-now-title {
  margin: 10px 0 0;
  max-width: 86%;
  font-family: var(--display);
  font-size: 24px;
  line-height: 1.12;
}

.pro-now-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 11px;
}

.pro-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 28px;
  padding: 5px 9px;
  border-radius: 999px;
  border: 1px solid var(--rule);
  background: color-mix(in srgb, var(--surface-2) 86%, transparent);
  font-size: 11px;
  color: var(--ink-dim);
}

.pro-pill strong {
  color: var(--ink);
  font-weight: 700;
}

.pro-now-actions {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin-top: 16px;
}

.pro-action {
  min-height: 44px;
  border-radius: 12px;
  border: 1px solid var(--rule);
  background: var(--surface-2);
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 7px;
  padding: 9px 12px;
  text-decoration: none;
  font-size: 12.5px;
  font-weight: 700;
}

.pro-action.primary {
  background: var(--pompeii);
  border-color: var(--pompeii);
  color: #FFF5EF;
}

.pro-action.gold {
  background: var(--naples);
  border-color: var(--naples);
  color: #1C160A;
}

.pro-action.ghost {
  background: transparent;
}

.pro-action.danger {
  border-color: color-mix(in srgb, var(--pro-danger) 60%, var(--rule));
  color: var(--pro-danger);
}

/* -------------------------------------------------------------------------- */
/* AÇÕES RÁPIDAS                                                               */
/* -------------------------------------------------------------------------- */

.pro-quick-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}

.pro-quick {
  min-width: 0;
  border: 1px solid var(--rule);
  border-radius: 14px;
  background: var(--surface);
  padding: 10px 7px;
  min-height: 78px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 7px;
  text-align: center;
  color: var(--ink);
}

.pro-quick-icon {
  width: 31px;
  height: 31px;
  display: grid;
  place-items: center;
  border-radius: 10px;
  background: var(--surface-2);
  font-size: 15px;
}

.pro-quick-label {
  width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 10.5px;
  color: var(--ink-dim);
}

/* -------------------------------------------------------------------------- */
/* BARRA DE PESQUISA E FILTROS                                                 */
/* -------------------------------------------------------------------------- */

.pro-toolbar {
  position: sticky;
  top: 72px;
  z-index: 22;
  margin: -2px -18px 14px;
  padding: 9px 18px 10px;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid color-mix(in srgb, var(--rule) 65%, transparent);
}

.pro-search-wrap {
  position: relative;
}

.pro-search {
  width: 100%;
  min-height: 44px;
  padding: 10px 42px 10px 40px;
  border-radius: 13px;
  border: 1px solid var(--rule);
  background: var(--surface);
  color: var(--ink);
  font-size: 13.5px;
}

.pro-search-icon {
  position: absolute;
  left: 13px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--ink-dim);
  pointer-events: none;
}

.pro-search-clear {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 9px;
  color: var(--ink-dim);
}

.pro-filter-row {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  margin-top: 8px;
  padding-bottom: 1px;
  scrollbar-width: none;
}

.pro-filter-row::-webkit-scrollbar {
  display: none;
}

.pro-filter {
  flex: none;
  min-height: 34px;
  padding: 7px 11px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink-dim);
  font-size: 11px;
  font-weight: 700;
}

.pro-filter.is-active {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
}

/* -------------------------------------------------------------------------- */
/* MELHORIAS NA TIMELINE ORIGINAL                                             */
/* -------------------------------------------------------------------------- */

.stop {
  scroll-margin-top: 150px;
}

.stop .card {
  box-shadow: 0 6px 22px rgba(0, 0, 0, .035);
}

.card .pro-stop-tools {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 6px;
  margin-top: 9px;
  padding-top: 9px;
  border-top: 1px dashed var(--rule);
}

.pro-icon-tool {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  border: 1px solid var(--rule);
  background: transparent;
  display: grid;
  place-items: center;
  color: var(--ink-dim);
  font-size: 14px;
}

.pro-icon-tool.is-favorite {
  color: var(--naples);
  border-color: color-mix(in srgb, var(--naples) 65%, var(--rule));
  background: color-mix(in srgb, var(--naples) 9%, transparent);
}

.pro-icon-tool.is-skipped {
  color: var(--pro-warning);
}

.pro-delay-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 0 0 13px;
  padding: 10px 11px;
  border: 1px solid var(--rule);
  border-radius: 12px;
  background: var(--surface);
}

.pro-delay-copy {
  min-width: 0;
}

.pro-delay-copy b {
  display: block;
  font-size: 12.5px;
}

.pro-delay-copy small {
  display: block;
  margin-top: 2px;
  color: var(--ink-dim);
  font-size: 10.5px;
}

.pro-delay-controls {
  flex: none;
  display: flex;
  align-items: center;
  gap: 5px;
}

.pro-delay-btn {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border: 1px solid var(--rule);
  border-radius: 10px;
  background: var(--surface-2);
  font-weight: 800;
}

.pro-delay-value {
  min-width: 56px;
  text-align: center;
  font-family: var(--data);
  font-size: 11px;
  color: var(--naples);
}

/* -------------------------------------------------------------------------- */
/* CARTEIRA DE RESERVAS                                                        */
/* -------------------------------------------------------------------------- */

.pro-wallet-summary {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin-bottom: 16px;
}

.pro-wallet-stat {
  padding: 11px 9px;
  border-radius: 13px;
  background: var(--surface);
  border: 1px solid var(--rule);
  text-align: center;
}

.pro-wallet-stat strong {
  display: block;
  font-family: var(--display);
  font-size: 21px;
  line-height: 1;
}

.pro-wallet-stat span {
  display: block;
  margin-top: 5px;
  color: var(--ink-dim);
  font-family: var(--data);
  font-size: 8.5px;
  letter-spacing: .10em;
  text-transform: uppercase;
}

.pro-wallet-list {
  display: grid;
  gap: 10px;
}

.pro-ticket {
  position: relative;
  overflow: hidden;
  border: 1px solid var(--rule);
  background: var(--surface);
  border-radius: var(--pro-radius-md);
  padding: 14px;
}

.pro-ticket::before,
.pro-ticket::after {
  content: "";
  position: absolute;
  top: 56px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--bg);
  border: 1px solid var(--rule);
}

.pro-ticket::before {
  left: -10px;
}

.pro-ticket::after {
  right: -10px;
}

.pro-ticket-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  padding-bottom: 12px;
  margin-bottom: 12px;
  border-bottom: 1px dashed var(--rule);
}

.pro-ticket-kicker {
  font-family: var(--data);
  color: var(--ink-dim);
  font-size: 9px;
  letter-spacing: .14em;
  text-transform: uppercase;
}

.pro-ticket-title {
  margin: 4px 0 0;
  font-family: var(--display);
  font-size: 18px;
  line-height: 1.2;
}

.pro-ticket-status {
  flex: none;
  border-radius: 999px;
  padding: 5px 8px;
  font-family: var(--data);
  font-size: 8.5px;
  letter-spacing: .09em;
  text-transform: uppercase;
  font-weight: 800;
}

.pro-ticket-status.confirmed {
  color: var(--pro-positive);
  border: 1px solid color-mix(in srgb, var(--pro-positive) 50%, transparent);
  background: color-mix(in srgb, var(--pro-positive) 10%, transparent);
}

.pro-ticket-status.pending {
  color: var(--pro-warning);
  border: 1px solid color-mix(in srgb, var(--pro-warning) 50%, transparent);
  background: color-mix(in srgb, var(--pro-warning) 10%, transparent);
}

.pro-ticket-status.urgent {
  color: var(--pro-danger);
  border: 1px solid color-mix(in srgb, var(--pro-danger) 50%, transparent);
  background: color-mix(in srgb, var(--pro-danger) 10%, transparent);
}

.pro-ticket-status.planned {
  color: var(--pro-info);
  border: 1px solid color-mix(in srgb, var(--pro-info) 50%, transparent);
  background: color-mix(in srgb, var(--pro-info) 10%, transparent);
}

.pro-ticket-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
}

.pro-ticket-field {
  min-width: 0;
}

.pro-ticket-field span {
  display: block;
  color: var(--ink-dim);
  font-family: var(--data);
  font-size: 8.5px;
  letter-spacing: .11em;
  text-transform: uppercase;
}

.pro-ticket-field b {
  display: block;
  margin-top: 3px;
  font-size: 12.5px;
  font-weight: 650;
  line-height: 1.35;
  overflow-wrap: anywhere;
}

.pro-ticket-note {
  margin-top: 11px;
  padding: 9px 10px;
  border-radius: 10px;
  background: var(--surface-2);
  color: var(--ink-dim);
  font-size: 11.5px;
  line-height: 1.45;
}

.pro-ticket-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 11px;
}

/* -------------------------------------------------------------------------- */
/* GASTOS E ACERTO DO CASAL                                                    */
/* -------------------------------------------------------------------------- */

.pro-money-hero {
  border: 1px solid var(--rule);
  border-radius: var(--pro-radius-lg);
  padding: 17px;
  background:
    radial-gradient(circle at 95% 5%, color-mix(in srgb, var(--verdigris) 19%, transparent), transparent 32%),
    var(--surface);
}

.pro-money-total-label {
  font-family: var(--data);
  font-size: 9.5px;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--ink-dim);
}

.pro-money-total {
  margin-top: 6px;
  font-family: var(--display);
  font-size: 38px;
  line-height: 1;
}

.pro-money-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin-top: 15px;
}

.pro-money-cell {
  padding: 11px;
  border-radius: 12px;
  background: var(--surface-2);
}

.pro-money-cell span {
  display: block;
  color: var(--ink-dim);
  font-size: 10px;
}

.pro-money-cell b {
  display: block;
  margin-top: 4px;
  font-family: var(--data);
  font-size: 14px;
}

.pro-balance-banner {
  margin-top: 10px;
  padding: 11px 12px;
  border-radius: 12px;
  background: color-mix(in srgb, var(--pro-info) 11%, var(--surface-2));
  border: 1px solid color-mix(in srgb, var(--pro-info) 35%, var(--rule));
  font-size: 12px;
  line-height: 1.45;
}

.pro-expense-list {
  display: grid;
  gap: 8px;
}

.pro-expense {
  display: grid;
  grid-template-columns: 38px minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  padding: 11px;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 13px;
}

.pro-expense-icon {
  width: 38px;
  height: 38px;
  border-radius: 11px;
  background: var(--surface-2);
  display: grid;
  place-items: center;
  font-size: 16px;
}

.pro-expense-main {
  min-width: 0;
}

.pro-expense-title {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 13px;
  font-weight: 700;
}

.pro-expense-meta {
  margin-top: 2px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--ink-dim);
  font-size: 10.5px;
}

.pro-expense-amount {
  text-align: right;
  font-family: var(--data);
  font-size: 13px;
  font-weight: 750;
}

.pro-expense-amount small {
  display: block;
  margin-top: 2px;
  color: var(--ink-dim);
  font-size: 8.5px;
  font-weight: 500;
}

.pro-budget-bars {
  display: grid;
  gap: 9px;
}

.pro-budget-row {
  padding: 10px 11px;
  border: 1px solid var(--rule);
  border-radius: 12px;
  background: var(--surface);
}

.pro-budget-row-head {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 11.5px;
}

.pro-budget-row-head span:last-child {
  font-family: var(--data);
  color: var(--ink-dim);
}

.pro-budget-track {
  height: 6px;
  margin-top: 8px;
  overflow: hidden;
  border-radius: 999px;
  background: var(--surface-2);
}

.pro-budget-fill {
  height: 100%;
  border-radius: inherit;
  background: var(--verdigris);
  transition: width .25s ease;
}

.pro-budget-fill.over {
  background: var(--pompeii);
}

/* -------------------------------------------------------------------------- */
/* CHECKLIST                                                                   */
/* -------------------------------------------------------------------------- */

.pro-check-progress {
  padding: 14px;
  border-radius: 15px;
  border: 1px solid var(--rule);
  background: var(--surface);
  margin-bottom: 13px;
}

.pro-check-progress-head {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: baseline;
}

.pro-check-progress-head strong {
  font-family: var(--display);
  font-size: 18px;
}

.pro-check-progress-head span {
  color: var(--ink-dim);
  font-family: var(--data);
  font-size: 10px;
}

.pro-check-group {
  border: 1px solid var(--rule);
  border-radius: 15px;
  background: var(--surface);
  overflow: hidden;
  margin-bottom: 10px;
}

.pro-check-group-head {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 13px;
  text-align: left;
}

.pro-check-group-title {
  display: flex;
  align-items: center;
  gap: 9px;
  font-weight: 750;
  font-size: 13px;
}

.pro-check-group-count {
  font-family: var(--data);
  font-size: 9.5px;
  color: var(--ink-dim);
}

.pro-check-items {
  border-top: 1px solid var(--rule);
}

.pro-check-item {
  display: grid;
  grid-template-columns: 28px minmax(0, 1fr) auto;
  gap: 9px;
  align-items: center;
  padding: 11px 13px;
  border-bottom: 1px solid color-mix(in srgb, var(--rule) 65%, transparent);
}

.pro-check-item:last-child {
  border-bottom: 0;
}

.pro-check-box {
  width: 24px;
  height: 24px;
  border-radius: 8px;
  border: 1.5px solid var(--rule);
  background: var(--surface-2);
  display: grid;
  place-items: center;
  font-size: 12px;
}

.pro-check-item.is-done .pro-check-box {
  background: var(--verdigris);
  border-color: var(--verdigris);
  color: #0E1814;
}

.pro-check-copy {
  min-width: 0;
}

.pro-check-copy b {
  display: block;
  font-size: 12.5px;
  line-height: 1.35;
}

.pro-check-copy small {
  display: block;
  margin-top: 2px;
  color: var(--ink-dim);
  font-size: 10.5px;
  line-height: 1.35;
}

.pro-check-item.is-done .pro-check-copy {
  opacity: .55;
}

.pro-check-item.is-done .pro-check-copy b {
  text-decoration: line-through;
}

.pro-check-remove {
  width: 30px;
  height: 30px;
  border-radius: 9px;
  color: var(--ink-dim);
}

/* -------------------------------------------------------------------------- */
/* GUIA RÁPIDO / FRASES / FAVORITOS                                           */
/* -------------------------------------------------------------------------- */

.pro-guide-grid {
  display: grid;
  gap: 10px;
}

.pro-guide-card {
  padding: 13px;
  border: 1px solid var(--rule);
  border-radius: 14px;
  background: var(--surface);
}

.pro-guide-card h4 {
  margin: 0;
  font-family: var(--display);
  font-size: 16px;
}

.pro-guide-card p {
  margin: 6px 0 0;
  color: var(--ink-dim);
  font-size: 11.5px;
  line-height: 1.5;
}

.pro-phrase-list {
  display: grid;
  gap: 7px;
}

.pro-phrase {
  width: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
  padding: 11px 12px;
  border: 1px solid var(--rule);
  border-radius: 12px;
  background: var(--surface);
  text-align: left;
}

.pro-phrase-pt {
  color: var(--ink-dim);
  font-size: 10.5px;
}

.pro-phrase-it {
  display: block;
  margin-top: 2px;
  font-size: 13px;
  font-weight: 700;
}

.pro-phrase-copy {
  color: var(--pompeii);
  font-family: var(--data);
  font-size: 9px;
  letter-spacing: .1em;
  text-transform: uppercase;
}

.pro-favorite-list {
  display: grid;
  gap: 8px;
}

.pro-favorite {
  padding: 11px 12px;
  border: 1px solid var(--rule);
  border-radius: 12px;
  background: var(--surface);
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
}

.pro-favorite b {
  display: block;
  font-size: 12.5px;
}

.pro-favorite small {
  display: block;
  margin-top: 2px;
  color: var(--ink-dim);
  font-size: 10px;
}

/* -------------------------------------------------------------------------- */
/* MAIS / CONFIGURAÇÕES                                                        */
/* -------------------------------------------------------------------------- */

.pro-setting-list {
  display: grid;
  gap: 8px;
}

.pro-setting {
  display: grid;
  grid-template-columns: 38px minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  min-height: 62px;
  padding: 10px 12px;
  border: 1px solid var(--rule);
  border-radius: 13px;
  background: var(--surface);
}

.pro-setting-icon {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 11px;
  background: var(--surface-2);
}

.pro-setting-copy {
  min-width: 0;
}

.pro-setting-copy b {
  display: block;
  font-size: 12.5px;
}

.pro-setting-copy small {
  display: block;
  margin-top: 2px;
  color: var(--ink-dim);
  font-size: 10.5px;
  line-height: 1.35;
}

.pro-setting-control {
  flex: none;
}

.pro-switch {
  position: relative;
  width: 44px;
  height: 26px;
  border-radius: 999px;
  background: var(--surface-2);
  border: 1px solid var(--rule);
}

.pro-switch::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--ink-dim);
  transition: left .2s ease, background .2s ease;
}

.pro-switch[aria-pressed="true"] {
  background: color-mix(in srgb, var(--verdigris) 28%, var(--surface-2));
  border-color: var(--verdigris);
}

.pro-switch[aria-pressed="true"]::after {
  left: 21px;
  background: var(--verdigris);
}

/* -------------------------------------------------------------------------- */
/* FORMULÁRIOS / MODAIS                                                        */
/* -------------------------------------------------------------------------- */

.pro-fab {
  position: fixed;
  right: 18px;
  bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);
  z-index: 44;
  min-width: 52px;
  height: 52px;
  padding: 0 16px;
  border-radius: 17px;
  border: 0;
  background: var(--naples);
  color: #1C160A;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  box-shadow: var(--pro-shadow-md);
  font-size: 12px;
  font-weight: 800;
}

.pro-modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  background: rgba(0, 0, 0, .55);
  backdrop-filter: blur(7px);
  -webkit-backdrop-filter: blur(7px);
  padding: 12px;
}

.pro-modal {
  width: min(100%, 600px);
  max-height: min(88dvh, 760px);
  overflow-y: auto;
  border-radius: 22px 22px 18px 18px;
  border: 1px solid var(--rule);
  background: var(--bg);
  box-shadow: var(--pro-shadow-lg);
  animation: proSheetIn .2s ease;
}

@keyframes proSheetIn {
  from {
    transform: translateY(24px);
    opacity: .5;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

.pro-modal-head {
  position: sticky;
  top: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 14px 15px;
  border-bottom: 1px solid var(--rule);
  background: color-mix(in srgb, var(--bg) 94%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.pro-modal-head h3 {
  margin: 0;
  font-family: var(--display);
  font-size: 19px;
}

.pro-modal-close {
  width: 36px;
  height: 36px;
  border-radius: 11px;
  border: 1px solid var(--rule);
  background: var(--surface);
}

.pro-modal-body {
  padding: 15px;
}

.pro-form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.pro-field {
  min-width: 0;
}

.pro-field.full {
  grid-column: 1 / -1;
}

.pro-field label {
  display: block;
  margin-bottom: 5px;
  color: var(--ink-dim);
  font-family: var(--data);
  font-size: 9px;
  letter-spacing: .11em;
  text-transform: uppercase;
}

.pro-field input,
.pro-field select,
.pro-field textarea {
  width: 100%;
  min-height: 43px;
  border-radius: 11px;
  border: 1px solid var(--rule);
  background: var(--surface);
  color: var(--ink);
  padding: 10px 11px;
  font-size: 13px;
}

.pro-field textarea {
  min-height: 86px;
}

.pro-form-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 15px;
}

.pro-empty {
  padding: 28px 18px;
  border: 1px dashed var(--rule);
  border-radius: 15px;
  text-align: center;
  color: var(--ink-dim);
}

.pro-empty-icon {
  font-size: 28px;
  opacity: .8;
}

.pro-empty b {
  display: block;
  margin-top: 8px;
  color: var(--ink);
  font-family: var(--display);
  font-size: 17px;
}

.pro-empty p {
  margin: 5px auto 0;
  max-width: 380px;
  font-size: 11.5px;
  line-height: 1.5;
}

  }

  .pro-guide-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

    grid-template-columns: repeat(4, minmax(0, 1fr));

  }

@media print {

/* ================================================================
   2. PERSISTÊNCIA
   Funciona tanto no arquivo aberto direto no navegador (localStorage)
   quanto dentro de um Artifact do Claude.ai (window.storage).
   ================================================================ */
const KEY = "italia2026";
let STATE = {done:{}, budget:{}, notes:{}};

const store = {
  async get(){
    if(window.storage){
      try{ const r = await window.storage.get(KEY); return r ? r.value : null; }catch(e){}
    }
    try{ return localStorage.getItem(KEY); }catch(e){ return null; }
  },
  async set(v){
    if(window.storage){
      try{ await window.storage.set(KEY, v); return; }catch(e){}
    }
    try{ localStorage.setItem(KEY, v); }catch(e){}
  }
};

async function loadState(){
  const raw = await store.get();
  if(raw){ try{ STATE = Object.assign({done:{},budget:{},notes:{}}, JSON.parse(raw)); }catch(e){} }
}
let saveTimer;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=> store.set(JSON.stringify(STATE)), 250);
}

/* ================================================================
   3. TEMPO — estados de cada parada
   ================================================================ */
const now = () => new Date();
function stopDate(day, hhmm){
  const [Y,M,D] = day.date.split("-").map(Number);
  const [h,m] = hhmm.split(":").map(Number);
  return new Date(Y, M-1, D, h, m, 0, 0);
}
function key(day, i){ return day.date + "#" + i; }
function isDone(day, i){ return !!STATE.done[key(day,i)]; }

/* Estado temporal: past | now | next | late | future */
function stopState(day, i){
  const s = day.stops[i];
  const start = stopDate(day, s.t);
  const end = s.end ? stopDate(day, s.end) : new Date(start.getTime() + 30*60000);
  const t = now();
  if(t >= start && t <= end) return "now";
  if(t > end) return isDone(day,i) ? "past" : "late";
  // futuro: a próxima não concluída do dia é "next"
  for(let j=0;j<day.stops.length;j++){
    const st = stopDate(day, day.stops[j].t);
    if(st > t && !isDone(day,j)) return j===i ? "next" : "future";
  }
  return "future";
}
function todayIndex(){
  const t = now(), iso = t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
  const exact = TRIP.findIndex(d => d.date === iso);
  if(exact >= 0) return exact;
  if(iso < TRIP[0].date) return 0;
  return TRIP.length - 1;
}
function fmtDate(iso){
  const [Y,M,D] = iso.split("-");
  const MES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
  return D + " " + MES[+M-1];
}
function mapsURL(day, s){
  const q = s.q || (s.n + " " + (CITY_Q[day.city] || day.city));
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
}

/* ================================================================
   4. RENDERIZAÇÃO
   ================================================================ */
function renderStops(day){
  return '<div class="rail">' + day.stops.map((s,i)=>{
    const st = stopState(day,i), done = isDone(day,i);
    const dur = s.end ? s.end : "";
    const badge = done ? "" :
      st==="now"  ? '<span class="badge now">agora</span>' :
      st==="next" ? '<span class="badge next">próxima</span>' :
      st==="late" ? '<span class="badge late">atrasada</span>' : "";
    return `
    <div class="stop ${done?"is-done":""}" data-state="${st}">
      <div class="marker">
        <div class="mk-time">${s.t}</div>
        ${dur?`<div class="mk-dur">${dur}</div>`:""}
      </div>
      <div class="dot"></div>
      <div class="card">
        <div class="cat"><span>${ICON[s.cat]||ICON.marco}</span>${CATNAME[s.cat]||""}${badge}</div>
        <h3>${s.n}${s.sug?'<span class="sugg">sugestão</span>':""}</h3>
        ${s.loc?`<div class="loc">${s.loc}</div>`:""}
        ${s.note?`<div class="note ${s.tip?"tip":""}">${s.note}</div>`:""}
        <div class="actions">
          <button class="btn done" data-done="${key(day,i)}" aria-pressed="${done}">
            ${done?"✓ Concluído":"Marcar concluído"}
          </button>
          ${s.nomap?"":`<a class="btn maps" href="${mapsURL(day,s)}" target="_blank" rel="noopener">${NAVICON.mapa} Maps</a>
          <button class="btn icon-only" data-copy="${escAttr(s.loc||s.q||s.n)}" aria-label="Copiar endereço">${ICON_COPY}</button>`}
        </div>
      </div>
    </div>
    ${s.leg?`<div class="leg">${s.leg}</div>`:""}`;
  }).join("") + '</div>';
}

function renderDay(day){
  const idx = TRIP.indexOf(day);
  const total = day.stops.length;
  const done = day.stops.filter((_,i)=>isDone(day,i)).length;
  const pct = total ? Math.round(done/total*100) : 0;
  return `
    <div class="dayhero">
      <div class="hero-art">${HERO[day.city]||HERO["Roma"]}</div>
      <div class="dh-inner">
        <div class="dh-meta">${day.wd} · ${fmtDate(day.date)} · ${day.city}</div>
        <h2>${day.title}</h2>
        ${day.sub?`<div class="dh-tag">${day.sub}</div>`:""}
        <div class="progress">
          <div class="bar"><i style="width:${pct}%"></i></div>
          <div class="lbl"><span>${done} de ${total} concluídos</span><span>${pct}%</span></div>
        </div>
      </div>
    </div>
    <div class="day-actions">
      <button class="btn" data-share="${idx}">${ICON_SHARE} Compartilhar</button>
      <button class="btn" data-ics="${idx}">${ICON_CAL} Calendário</button>

    ${renderStops(day)}
    <div class="notes">
      <label for="nt-${day.date}">Anotações do dia</label>
      <textarea id="nt-${day.date}" data-note="${day.date}"
        placeholder="O que aconteceu, o que comeram, o que mudar amanhã…">${STATE.notes[day.date]||""}</textarea>
    </div>`;
}

function renderTripTrack(){
  const tIdx = todayIndex();
  return '<div class="triptrack">' + TRIP.map((d,i)=>{
    const total = d.stops.length;
    const done = d.stops.filter((_,j)=>isDone(d,j)).length;
    const pct = total ? Math.round(done/total*100) : 0;
    return `<button class="tp-item ${i===tIdx?"is-today":""}" data-tripday="${i}" aria-label="${d.wd} ${fmtDate(d.date)}, ${pct}% concluído">
      <div class="tp-bar"><i style="height:${pct}%"></i></div>
      <div class="tp-lbl">${fmtDate(d.date).split(" ")[0]}</div>
    </button>`;
  }).join("") + '</div>';
}

function bval(date, cat, kind){
  const k = date+"#"+cat+"#"+kind;
  if(STATE.budget[k] !== undefined) return STATE.budget[k];
  if(kind==="est" && BSEED[date] && BSEED[date][cat] !== undefined) return BSEED[date][cat];
  return "";
}
function renderOrcamento(){
  let estT=0, realT=0;
  TRIP.forEach(d => BCATS.forEach(([c])=>{
    estT += parseFloat(bval(d.date,c,"est"))||0;
    realT += parseFloat(bval(d.date,c,"real"))||0;
  }));
  const diff = realT - estT;
  const diffTxt = realT===0 ? "Ainda sem gastos reais lançados."
    : diff > 0 ? `€${diff.toFixed(2)} acima do previsto.`
    : diff < 0 ? `€${Math.abs(diff).toFixed(2)} abaixo do previsto.`
    : "Exatamente no previsto.";

  const days = TRIP.map(d=>{
    let dE=0,dR=0;
    BCATS.forEach(([c])=>{dE+=parseFloat(bval(d.date,c,"est"))||0; dR+=parseFloat(bval(d.date,c,"real"))||0;});
    return `
    <div class="bday">
      <h4>${fmtDate(d.date)} · ${d.city}<em>est €${dE.toFixed(0)} · real €${dR.toFixed(0)}</em></h4>
      <div class="bhead"><span>Categoria</span><span>Previsto</span><span>Real</span></div>
      ${BCATS.map(([c,lbl])=>`
        <div class="brow">
          <div class="bk">${lbl}</div>
          <input type="number" inputmode="decimal" min="0" step="0.5" placeholder="0"
            data-b="${d.date}#${c}#est" value="${bval(d.date,c,"est")}">
          <input type="number" inputmode="decimal" min="0" step="0.5" placeholder="0"
            data-b="${d.date}#${c}#real" value="${bval(d.date,c,"real")}">
        </div>`).join("")}
    </div>`;
  }).join("");

  document.getElementById("view-orcamento").innerHTML = `
    <div class="total">
      <div class="t-lbl">Total da viagem · euros</div>
      <div class="t-grid">
        <div class="t-val">€${estT.toFixed(0)}<small>Previsto</small></div>
        <div class="t-val" style="color:var(--naples)">€${realT.toFixed(0)}<small>Real</small></div>
      </div>
      <div class="t-diff">${diffTxt}</div>
    </div>
    ${days}

      <button class="btn" id="expBtn">Exportar backup</button>
      <button class="btn" id="impBtn">Importar backup</button>
      <input type="file" id="impFile" accept="application/json" hidden>
      <div class="hint">O backup guarda paradas concluídas, gastos e anotações num arquivo JSON — útil se trocarem de aparelho.</div>
    </div>`;
}

          <span class="ml-go">Abrir</span>

/* Contagem regressiva para a próxima parada não concluída */
function renderCountdown(){
  const el = document.getElementById("countdown");
  const day = TRIP[todayIndex()];
  const t = now();
  const iso = t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
  if(iso !== day.date){ el.hidden = true; return; }

  let next = null, late = null;
  day.stops.forEach((s,i)=>{
    if(isDone(day,i)) return;
    const st = stopDate(day,s.t);
    if(st > t){ if(!next) next = {s,st}; }
    else { const end = s.end ? stopDate(day,s.end) : new Date(st.getTime()+30*60000);
           if(t > end) late = {s,st}; }
  });

  if(late && !next){
    el.hidden = false; el.classList.add("is-late");
    document.getElementById("cdTime").textContent = "!";
    document.getElementById("cdName").textContent = late.s.n;
    document.getElementById("cdSub").textContent = "Estava previsto às " + late.s.t + " e não foi marcado";
    return;
  }
  if(!next){ el.hidden = true; return; }

  const ms = next.st - t, mins = Math.floor(ms/60000);
  const h = Math.floor(mins/60), m = mins%60;
  el.hidden = false;
  el.classList.toggle("is-late", !!late);
  document.getElementById("cdTime").textContent = h > 0 ? `${h}h${String(m).padStart(2,"0")}` : `${m}min`;
  document.getElementById("cdName").textContent = next.s.n;
  document.getElementById("cdSub").textContent = late
    ? "Próxima às " + next.s.t + " · há paradas atrasadas"
    : "Próxima às " + next.s.t;
}

/* ================================================================
   5. AÇÕES — compartilhar, calendário (.ics), copiar, avisos
   ================================================================ */
function escAttr(s){ return String(s||"").replace(/"/g,"&quot;"); }

let toastTimer;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove("show"), 1900);
}

function copyAddr(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast("Endereço copiado")).catch(()=>toast("Não foi possível copiar"));
  } else { toast("Cópia não suportada neste navegador"); }
}

function shareText(day){
  return `${day.title} — ${day.wd}, ${fmtDate(day.date)}\n\n` +
    day.stops.map(s=>`${s.t} · ${s.n}`).join("\n");
}
function shareDay(idx){
  const day = TRIP[idx], text = shareText(day);
  if(navigator.share){
    navigator.share({title:day.title, text}).catch(()=>{});
  } else if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(()=>toast("Roteiro do dia copiado")).catch(()=>toast("Não foi possível compartilhar"));
  } else { toast("Compartilhamento não suportado"); }
}

function pad2(n){ return String(n).padStart(2,"0"); }
function addMinutes(hhmm, mins){
  const [h,m] = hhmm.split(":").map(Number);
  const d = new Date(2000,0,1,h,m+mins);
  return pad2(d.getHours())+":"+pad2(d.getMinutes());
}
function icsDate(day, hhmm){
  const [Y,M,D] = day.date.split("-");
  const [h,m] = hhmm.split(":");
  return `${Y}${M}${D}T${pad2(h)}${pad2(m)}00`;
}
function icsEscape(s){ return String(s||"").replace(/[\\,;]/g, x=>"\\"+x).replace(/\n/g,"\\n"); }
function buildICS(day){
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Roteiro Italia 2026//PT","CALSCALE:GREGORIAN"];
  day.stops.forEach((s,i)=>{
    const endT = s.end || addMinutes(s.t, 30);
    L.push("BEGIN:VEVENT");
    L.push("UID:"+day.date+"-"+i+"@roteiro-italia");
    L.push("DTSTART:"+icsDate(day,s.t));
    L.push("DTEND:"+icsDate(day,endT));
    L.push("SUMMARY:"+icsEscape(s.n));
    if(s.loc||s.q) L.push("LOCATION:"+icsEscape(s.loc||s.q));
    if(s.note) L.push("DESCRIPTION:"+icsEscape(s.note));
    L.push("END:VEVENT");
  });
  L.push("END:VCALENDAR");
  return L.join("\r\n");
}
function downloadICS(idx){
  const day = TRIP[idx];
  const blob = new Blob([buildICS(day)], {type:"text/calendar;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "roteiro-"+day.date+".ics";
  a.click(); URL.revokeObjectURL(a.href);
  toast("Arquivo de calendário baixado");
}

let curView = "hoje";

function refresh(){
  if(curView==="hoje") renderHoje();
  if(curView==="roteiro") renderRoteiro();
  if(curView==="orcamento") renderOrcamento();
  if(curView==="mapa") renderMapa();
  renderCountdown();
}
function switchView(v){
  curView = v;
  document.querySelectorAll(".view").forEach(s=>s.classList.toggle("active", s.id==="view-"+v));
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected", b.dataset.view===v));
  refresh();
  window.scrollTo({top:0,behavior:"smooth"});
}

/* Delegação de eventos — a interface é re-renderizada com frequência */
document.addEventListener("click", e=>{
  const nav = e.target.closest("nav button");
  if(nav){ switchView(nav.dataset.view); return; }

  const dc = e.target.closest(".daychip");
  if(dc){ selDay = +dc.dataset.day; renderRoteiro(); return; }

  const dn = e.target.closest("[data-done]");
  if(dn){
    const k = dn.dataset.done;
    if(STATE.done[k]) delete STATE.done[k]; else STATE.done[k] = 1;
    saveState(); refresh(); return;
  }

  const tp = e.target.closest("[data-tripday]");
  if(tp){ selDay = +tp.dataset.tripday; switchView("roteiro"); return; }

  const sh = e.target.closest("[data-share]");
  if(sh){ shareDay(+sh.dataset.share); return; }

  const ic = e.target.closest("[data-ics]");
  if(ic){ downloadICS(+ic.dataset.ics); return; }

  const cp = e.target.closest("[data-copy]");
  if(cp){ copyAddr(cp.dataset.copy); return; }

  if(e.target.id==="expBtn"){ exportBackup(); return; }
  if(e.target.id==="impBtn"){ document.getElementById("impFile").click(); return; }
});

/* Deslizar entre dias na aba Roteiro */
(function swipeSetup(){
  let x0=null, y0=null;
  const zone = document.getElementById("view-roteiro");
  zone.addEventListener("touchstart", e=>{
    const tt = e.touches[0]; x0 = tt.clientX; y0 = tt.clientY;
  }, {passive:true});
  zone.addEventListener("touchend", e=>{
    if(x0===null) return;
    const tt = e.changedTouches[0];
    const dx = tt.clientX - x0, dy = tt.clientY - y0;
    x0 = null;
    if(Math.abs(dx) < 62 || Math.abs(dy) > 70) return;
    if(dx < 0 && selDay < TRIP.length-1){ selDay++; renderRoteiro(); }
    else if(dx > 0 && selDay > 0){ selDay--; renderRoteiro(); }
  }, {passive:true});
})();

document.addEventListener("input", e=>{
  if(e.target.dataset.note !== undefined){
    STATE.notes[e.target.dataset.note] = e.target.value; saveState();
  }
  if(e.target.dataset.b !== undefined){
    const k = e.target.dataset.b;
    if(e.target.value==="") delete STATE.budget[k]; else STATE.budget[k] = e.target.value;
    saveState();
    // Atualiza só os totais, para não perder o foco do campo em edição
    if(curView==="orcamento") updateBudgetTotals();
  }
});

function updateBudgetTotals(){
  let estT=0, realT=0;
  TRIP.forEach(d => BCATS.forEach(([c])=>{
    estT += parseFloat(bval(d.date,c,"est"))||0;
    realT += parseFloat(bval(d.date,c,"real"))||0;
  }));
  const vals = document.querySelectorAll(".total .t-val");
  if(vals[0]) vals[0].childNodes[0].nodeValue = "€"+estT.toFixed(0);
  if(vals[1]) vals[1].childNodes[0].nodeValue = "€"+realT.toFixed(0);
  const diff = realT - estT;
  const d = document.querySelector(".t-diff");
  if(d) d.textContent = realT===0 ? "Ainda sem gastos reais lançados."
    : diff > 0 ? `€${diff.toFixed(2)} acima do previsto.`
    : diff < 0 ? `€${Math.abs(diff).toFixed(2)} abaixo do previsto.`
    : "Exatamente no previsto.";
}

function exportBackup(){
  const blob = new Blob([JSON.stringify(STATE,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "roteiro-italia-backup.json";
  a.click(); URL.revokeObjectURL(a.href);
}
document.addEventListener("change", e=>{
  if(e.target.id!=="impFile" || !e.target.files[0]) return;
  const fr = new FileReader();
  fr.onload = () => {
    try{
      STATE = Object.assign({done:{},budget:{},notes:{}}, JSON.parse(fr.result));
      saveState(); refresh();
    }catch(err){ alert("Arquivo de backup inválido."); }
  };
  fr.readAsText(e.target.files[0]);
});

function PRO_escape(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function PRO_money(value){
  const n = Number(value) || 0;
  return new Intl.NumberFormat("pt-BR",{
    style:"currency",
    currency:"EUR",
    minimumFractionDigits:2
  }).format(n);
}

function PRO_minutesLabel(value){
  const n = Number(value) || 0;
  if(n === 0) return "no horário";
  const sign = n > 0 ? "+" : "−";
  return sign + Math.abs(n) + " min";
}

function PRO_dayDelay(day){
  PRO_ensureState();
  return Number(STATE.delays[day.date]) || 0;
}

function PRO_adjustTime(day, hhmm){
  return addMinutes(hhmm, PRO_dayDelay(day));
}

function PRO_stopDate(day, hhmm){
  return stopDate(day, PRO_adjustTime(day, hhmm));
}

function PRO_isSkipped(day,index){
  PRO_ensureState();
  return !!STATE.skipped[key(day,index)];
}

function PRO_isResolved(day,index){
  return isDone(day,index) || PRO_isSkipped(day,index);
}

function PRO_isFavorite(day,index){
  PRO_ensureState();
  return !!STATE.favorites[key(day,index)];
}

function PRO_stopState(day,index){
  const s = day.stops[index];
  const start = PRO_stopDate(day,s.t);
  const end = s.end ? PRO_stopDate(day,s.end) : new Date(start.getTime()+30*60000);
  const current = now();
  if(PRO_isResolved(day,index) && current > end) return "past";
  if(current >= start && current <= end) return "now";
  if(current > end) return "late";
  for(let i=0;i<day.stops.length;i++){
    const candidate = PRO_stopDate(day,day.stops[i].t);
    if(candidate > current && !PRO_isResolved(day,i)) return i===index ? "next" : "future";
  }
  return "future";
}

function PRO_tripStats(){
  let total = 0;
  let done = 0;
  let skipped = 0;
  let favorites = 0;
  TRIP.forEach(day=>{
    day.stops.forEach((stop,index)=>{
      total++;
      if(isDone(day,index)) done++;
      if(PRO_isSkipped(day,index)) skipped++;
      if(PRO_isFavorite(day,index)) favorites++;
    });
  });
  const resolved = done + skipped;
  return {
    total,
    done,
    skipped,
    favorites,
    resolved,
    percent: total ? Math.round(resolved/total*100) : 0
  };
}

function PRO_findNext(){
  const current = now();
  let late = null;
  let next = null;
  TRIP.forEach((day,dayIndex)=>{
    day.stops.forEach((stop,stopIndex)=>{
      if(PRO_isResolved(day,stopIndex)) return;
      const start = PRO_stopDate(day,stop.t);
      const end = stop.end ? PRO_stopDate(day,stop.end) : new Date(start.getTime()+30*60000);
      const payload = {day,dayIndex,stop,stopIndex,start,end};
      if(current >= start && current <= end && !late) late = {...payload,live:true};
      else if(current > end) late = payload;
      else if(start > current && !next) next = payload;
    });
  });
  return {late,next};
}

function PRO_durationUntil(date){
  const diff = date - now();
  if(diff <= 0) return "agora";
  const mins = Math.floor(diff/60000);
  if(mins < 60) return mins + " min";
  const hours = Math.floor(mins/60);
  const remain = mins % 60;
  if(hours < 24) return hours + "h" + String(remain).padStart(2,"0");
  const days = Math.floor(hours/24);
  return days + (days===1 ? " dia" : " dias");
}

function PRO_filterStop(day,stop,index){
  const q = PRO_UI.itineraryQuery.trim().toLowerCase();
  const filter = PRO_UI.itineraryFilter;
  if(filter === "pending" && PRO_isResolved(day,index)) return false;
  if(filter === "favorites" && !PRO_isFavorite(day,index)) return false;
  if(filter === "food" && !["comida","mercado"].includes(stop.cat)) return false;
  if(filter === "transport" && !["voo","transporte"].includes(stop.cat)) return false;
  if(filter === "tickets" && !["marco","museu","igreja"].includes(stop.cat)) return false;
  if(!q) return true;
  const haystack = [stop.n,stop.cat,stop.loc,stop.note,stop.q,day.city,day.title]
    .filter(Boolean)
    .join(" ")
    .toLowerCase();
  return haystack.includes(q);
}

function PRO_todayIso(){
  const d = now();
  return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
}

function PRO_tripPhase(){
  const iso = PRO_todayIso();
  if(iso < TRIP[0].date) return "before";
  if(iso > TRIP[TRIP.length-1].date) return "after";
  if(TRIP.some(day=>day.date===iso)) return "during";
  return "between";
}

function PRO_renderNextCard(){

function PRO_expenseCategory(id){
  return PRO_EXPENSE_CATEGORIES.find(cat=>cat.id===id) || PRO_EXPENSE_CATEGORIES[PRO_EXPENSE_CATEGORIES.length-1];
}

function PRO_expenseStats(){
  PRO_ensureState();
  const names = STATE.settings.names;
  let total = 0;
  let paidMe = 0;
  let paidCompanion = 0;
  let shareMe = 0;
  let shareCompanion = 0;
  const byCategory = {};
  PRO_EXPENSE_CATEGORIES.forEach(cat=>byCategory[cat.id]=0);
  STATE.expenses.forEach(expense=>{
    const amount = Number(expense.amount) || 0;
    const myPercent = Number(expense.splitMe ?? 50);
    total += amount;
    if(expense.payer === "companion") paidCompanion += amount;
    else paidMe += amount;
    shareMe += amount * myPercent / 100;
    shareCompanion += amount * (100-myPercent) / 100;
    if(byCategory[expense.category] === undefined) byCategory[expense.category] = 0;
    byCategory[expense.category] += amount;
  });
  const balanceMe = paidMe - shareMe;
  let settlement = "Sem acerto necessário";
  if(balanceMe > .009) settlement = `${names.companion} deve ${PRO_money(balanceMe)} para ${names.me}`;
  if(balanceMe < -.009) settlement = `${names.me} deve ${PRO_money(Math.abs(balanceMe))} para ${names.companion}`;
  return {total,paidMe,paidCompanion,shareMe,shareCompanion,balanceMe,settlement,byCategory};
}

function PRO_renderBudgetBars(stats){
  return PRO_EXPENSE_CATEGORIES.map(cat=>{
    const spent = stats.byCategory[cat.id] || 0;
    const cap = Number(STATE.settings.budgetCaps[cat.id]) || 0;
    const percent = cap > 0 ? Math.min(100,Math.round(spent/cap*100)) : 0;
    const over = cap > 0 && spent > cap;
    return `
      <div class="pro-budget-row">
        <div class="pro-budget-row-head">
          <span>${cat.icon} ${cat.label}</span>
          <span>${PRO_money(spent)}${cap?` / ${PRO_money(cap)}`:""}</span>
        </div>
        <div class="pro-budget-track"><div class="pro-budget-fill ${over?"over":""}" style="width:${cap?Math.min(100,spent/cap*100):0}%"></div></div>
      </div>`;
  }).join("");
}

function PRO_renderExpenses(){
  PRO_ensureState();

function PRO_allChecklistItems(){
  const base = PRO_CHECKLIST_GROUPS.flatMap(group=>group.items.map(item=>({...item,groupId:group.id})));
  const custom = (STATE.customChecks||[]).map(item=>({...item,groupId:item.groupId||"custom"}));
  return base.concat(custom);
}

function PRO_checkStats(){
  const all = PRO_allChecklistItems();
  const done = all.filter(item=>STATE.checklist[item.id]).length;
  return {all:all.length,done,percent:all.length?Math.round(done/all.length*100):0};
}

function PRO_renderChecklistGroup(group){
  const custom = (STATE.customChecks||[]).filter(item=>(item.groupId||"custom")===group.id);

function renderCountdown(){
  PRO_ensureState();
  const el = document.getElementById("countdown");
  const day = TRIP[todayIndex()];
  const current = now();
  const iso = PRO_todayIso();
  if(iso !== day.date){
    el.hidden = true;
    return;
  }
  let next = null;
  let late = null;
  day.stops.forEach((stop,index)=>{
    if(PRO_isResolved(day,index)) return;
    const start = PRO_stopDate(day,stop.t);
    const end = stop.end ? PRO_stopDate(day,stop.end) : new Date(start.getTime()+30*60000);
    if(start > current){
      if(!next) next = {stop,start,index};
    }else if(current > end){
      late = {stop,start,index};
    }
  });
  if(late && !next){
    el.hidden = false;
    el.classList.add("is-late");
    document.getElementById("cdTime").textContent = "!";
    document.getElementById("cdName").textContent = late.stop.n;
    document.getElementById("cdSub").textContent = "Horário ajustado: " + PRO_adjustTime(day,late.stop.t);
    return;
  }
  if(!next){
    el.hidden = true;
    return;
  }
  el.hidden = false;
  el.classList.toggle("is-late",!!late);
  document.getElementById("cdTime").textContent = PRO_durationUntil(next.start);
  document.getElementById("cdName").textContent = next.stop.n;
  document.getElementById("cdSub").textContent = (late?"Há pendências · ":"") + "próxima às " + PRO_adjustTime(day,next.stop.t);
}

async function PRO_toggleWake(){
  try{
    if(PRO_UI.wakeLock){
      await PRO_UI.wakeLock.release();
      PRO_UI.wakeLock = null;
      STATE.settings.wakeRequested = false;
      saveState();
      toast("Tela ativa desativada");
    }else{
      if(!("wakeLock" in navigator)){
        toast("Wake Lock não é suportado neste navegador");
        return;
      }
      PRO_UI.wakeLock = await navigator.wakeLock.request("screen");
      STATE.settings.wakeRequested = true;
      saveState();
      PRO_UI.wakeLock.addEventListener("release",()=>{
        PRO_UI.wakeLock = null;
        if(curView==="mais") PRO_renderMore();
      });
      toast("Tela será mantida acordada");
    }
    if(curView==="mais") PRO_renderMore();
  }catch(error){
    toast("Não foi possível manter a tela ativa");
  }
}

async function PRO_toggleFullscreen(){
  try{
    if(document.fullscreenElement){
      await document.exitFullscreen();
    }else if(document.documentElement.requestFullscreen){
      await document.documentElement.requestFullscreen();
    }else{
      toast("Tela cheia não suportada");
    }
  }catch(error){
    toast("Não foi possível alterar a tela cheia");
  }
}

document.addEventListener("click",async event=>{
  const shortcut = event.target.closest("[data-view-shortcut]");

  const filter = event.target.closest("[data-pro-filter]");
